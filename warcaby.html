<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warcaby Klasyczne</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3d;
      --accent-color: #e74c3c;
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --highlight: rgba(241, 196, 15, 0.7);
      --move-dot: rgba(46, 204, 113, 0.85);
      --capture-dot: rgba(231, 76, 60, 0.85);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2rem;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      width: 100%;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      color: #a0a0b0;
    }

    select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background-color: #3b3b52;
      color: var(--text-color);
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    button.primary {
      background-color: var(--accent-color);
      font-weight: bold;
    }

    button.primary:hover {
      background-color: #c0392b;
    }

    .status-bar {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px 15px;
      background-color: var(--card-bg);
      border-radius: 8px;
      width: 100%;
      text-align: center;
    }

    /* Wyświetlanie planszy ze stałym wymiarem w pikselach dla pewności */
    .board-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 440px;
      height: 440px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      border: 4px solid var(--card-bg);
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .square.light {
      background-color: var(--board-light);
    }

    .square.dark {
      background-color: var(--board-dark);
    }

    .square.selected {
      background-color: var(--highlight) !important;
    }

    .square.valid-move::after {
      content: '';
      width: 16px;
      height: 16px;
      background-color: var(--move-dot);
      border-radius: 50%;
      position: absolute;
      z-index: 3;
    }

    .square.valid-capture::after {
      content: '';
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 4px solid var(--capture-dot);
      position: absolute;
      z-index: 3;
    }

    /* Piony i Damki */
    .piece {
      width: 80%;
      height: 80%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 2;
      transition: transform 0.15s ease;
    }

    .piece.white {
      background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
      border: 2px solid #999;
    }

    .piece.black {
      background: radial-gradient(circle at 30% 30%, #444444, #111111);
      border: 2px solid #000;
    }

    .piece.king::before {
      content: '👑';
      font-size: 1.4rem;
    }

    @media (max-width: 480px) {
      .board {
        width: 90vw;
        height: 90vw;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Warcaby Klasyczne</h1>

    <div class="controls">
      <div class="control-group">
        <label for="mode">Tryb gry:</label>
        <select id="mode">
          <option value="ai">Gracz vs Komputer</option>
          <option value="pvp">Gracz vs Gracz</option>
        </select>
      </div>

      <button class="primary" id="restart-btn">Nowa Gra</button>
    </div>

    <div class="status-bar" id="status">Tura Białych</div>

    <div class="board-wrapper">
      <div class="board" id="board"></div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 8;
    const WHITE = 'white';
    const BLACK = 'black';

    let boardState = [];
    let currentPlayer = WHITE;
    let selectedSquare = null;
    let validMovesForSelected = [];
    let isGameOver = false;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const modeSelect = document.getElementById('mode');
    const restartBtn = document.getElementById('restart-btn');

    function initBoard() {
      boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if ((r + c) % 2 !== 0) {
            if (r < 3) {
              boardState[r][c] = { color: BLACK, isKing: false };
            } else if (r > 4) {
              boardState[r][c] = { color: WHITE, isKing: false };
            }
          }
        }
      }

      currentPlayer = WHITE;
      selectedSquare = null;
      validMovesForSelected = [];
      isGameOver = false;

      updateStatus();
      renderBoard();
    }

    function renderBoard() {
      boardEl.innerHTML = '';

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const square = document.createElement('div');
          const isDark = (r + c) % 2 !== 0;
          square.className = `square ${isDark ? 'dark' : 'light'}`;

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            square.classList.add('selected');
          }

          const move = validMovesForSelected.find(m => m.r === r && m.c === c);
          if (move) {
            if (move.capture) {
              square.classList.add('valid-capture');
            } else {
              square.classList.add('valid-move');
            }
          }

          const piece = boardState[r][c];
          if (piece) {
            const pieceEl = document.createElement('div');
            pieceEl.className = `piece ${piece.color} ${piece.isKing ? 'king' : ''}`;
            square.appendChild(pieceEl);
          }

          square.addEventListener('click', () => handleSquareClick(r, c));
          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(r, c) {
      if (isGameOver) return;
      if (modeSelect.value === 'ai' && currentPlayer === BLACK) return;

      const clickedPiece = boardState[r][c];

      if (clickedPiece && clickedPiece.color === currentPlayer) {
        selectedSquare = { r, c };
        validMovesForSelected = getPieceMoves(r, c, boardState);
        renderBoard();
        return;
      }

      if (selectedSquare) {
        const move = validMovesForSelected.find(m => m.r === r && m.c === c);
        if (move) {
          executeMove(selectedSquare.r, selectedSquare.c, move);
          selectedSquare = null;
          validMovesForSelected = [];

          if (checkGameOver()) {
            renderBoard();
            return;
          }

          switchTurn();
          renderBoard();

          if (modeSelect.value === 'ai' && currentPlayer === BLACK && !isGameOver) {
            setTimeout(triggerAIMove, 400);
          }
        }
      }
    }

    function executeMove(fromR, fromC, move) {
      const piece = boardState[fromR][fromC];
      boardState[fromR][fromC] = null;

      if (move.capture) {
        boardState[move.capture.r][move.capture.c] = null;
      }

      if ((piece.color === WHITE && move.r === 0) || (piece.color === BLACK && move.r === 7)) {
        piece.isKing = true;
      }

      boardState[move.r][move.c] = piece;
    }

    function getPieceMoves(r, c, board) {
      const piece = board[r][c];
      if (!piece) return [];

      const moves = [];
      const directions = piece.isKing 
        ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
        : piece.color === WHITE ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];

      for (const [dr, dc] of directions) {
        const nr = r + dr;
        const nc = c + dc;

        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
          if (!board[nr][nc]) {
            moves.push({ r: nr, c: nc, capture: null });
          } else if (board[nr][nc].color !== piece.color) {
            const jumpR = nr + dr;
            const jumpC = nc + dc;
            if (jumpR >= 0 && jumpR < BOARD_SIZE && jumpC >= 0 && jumpC < BOARD_SIZE && !board[jumpR][jumpC]) {
              moves.push({ r: jumpR, c: jumpC, capture: { r: nr, c: nc } });
            }
          }
        }
      }

      return moves;
    }

    function getAllMoves(player, board) {
      const allMoves = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] && board[r][c].color === player) {
            const moves = getPieceMoves(r, c, board);
            moves.forEach(m => {
              allMoves.push({ fromR: r, fromC: c, ...m });
            });
          }
        }
      }
      return allMoves;
    }

    function switchTurn() {
      currentPlayer = currentPlayer === WHITE ? BLACK : WHITE;
      updateStatus();
    }

    function updateStatus() {
      if (isGameOver) return;
      if (modeSelect.value === 'ai') {
        statusEl.innerText = currentPlayer === WHITE ? 'Twoja tura (Białe)' : 'Komputer myśli...';
      } else {
        statusEl.innerText = currentPlayer === WHITE ? 'Tura: Gracz 1 (Białe)' : 'Tura: Gracz 2 (Czarne)';
      }
    }

    function checkGameOver() {
      const whiteMoves = getAllMoves(WHITE, boardState);
      const blackMoves = getAllMoves(BLACK, boardState);

      let whitePieces = 0;
      let blackPieces = 0;

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (boardState[r][c]?.color === WHITE) whitePieces++;
          if (boardState[r][c]?.color === BLACK) blackPieces++;
        }
      }

      if (whitePieces === 0 || whiteMoves.length === 0) {
        isGameOver = true;
        statusEl.innerText = modeSelect.value === 'ai' ? '💻 Komputer wygrał!' : '🎉 Wygrywają Czarne!';
        return true;
      }
      if (blackPieces === 0 || blackMoves.length === 0) {
        isGameOver = true;
        statusEl.innerText = '🎉 Wygrywają Białe!';
        return true;
      }
      return false;
    }

    function triggerAIMove() {
      if (isGameOver) return;

      const moves = getAllMoves(BLACK, boardState);
      if (moves.length === 0) {
        checkGameOver();
        return;
      }

      const captures = moves.filter(m => m.capture);
      const chosenMove = captures.length > 0 
        ? captures[Math.floor(Math.random() * captures.length)] 
        : moves[Math.floor(Math.random() * moves.length)];

      executeMove(chosenMove.fromR, chosenMove.fromC, chosenMove);

      if (!checkGameOver()) {
        switchTurn();
      }
      renderBoard();
    }

    modeSelect.addEventListener('change', initBoard);
    restartBtn.addEventListener('click', initBoard);

    initBoard();
  </script>
</body>
</html>
