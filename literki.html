<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literkowe Safari - Gra Edukacyjna</title>
    <!-- Biblioteka do konfetti dla pozytywnego wzmocnienia -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        #start-screen, #game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-screen {
            display: none;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .btn-start {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            margin-top: 30px;
        }

        .btn-start:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }

        .letter-display {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
            cursor: pointer;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }

        .letter-display:active {
            transform: scale(0.95);
        }

        .options-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .option-card {
            background-color: var(--card-bg);
            border: 4px solid #e0e0e0;
            border-radius: 20px;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .option-card:hover {
            transform: scale(1.05);
            border-color: var(--secondary);
        }

        .option-card.wrong {
            animation: shake 0.5s;
            border-color: #ff9999;
            opacity: 0.7;
        }

        .option-card.correct {
            border-color: #66cc66;
            background-color: #e6ffe6;
            transform: scale(1.1);
        }

        .instruction {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
        }

        /* Animacje */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Responsywność dla małych ekranów (np. telefony) */
        @media (max-width: 480px) {
            .letter-display { font-size: 6rem; }
            .option-card { width: 90px; height: 90px; font-size: 3rem; gap: 10px; }
            h1 { font-size: 2rem; }
            .instruction { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Ekran startowy (wymagany by przeglądarka pozwoliła na odtwarzanie dźwięku) -->
    <div id="start-screen">
        <h1>🐘 Literkowe Safari 🍉</h1>
        <p style="font-size: 1.2rem;">Włącz dźwięk w urządzeniu!</p>
        <button class="btn-start" onclick="startGame()">Grajmy!</button>
    </div>

    <!-- Ekran gry -->
    <div id="game-screen">
        <div class="instruction" id="instruction-text">Co zaczyna się na literę...</div>
        
        <div class="letter-display" id="current-letter" onclick="repeatAudio()">A a</div>
        
        <div class="options-container" id="options">
            <!-- Tutaj JavaScript wstawi przyciski z obrazkami -->
        </div>
    </div>

    <script>
        // Słownik polskiego alfabetu (litera, słowo, emoji)
        const alphabetData = [
            { letter: "A", word: "arbuz", emoji: "🍉" },
            { letter: "B", word: "balon", emoji: "🎈" },
            { letter: "C", word: "cytryna", emoji: "🍋" },
            { letter: "D", word: "dom", emoji: "🏠" },
            { letter: "F", word: "flaga", emoji: "🚩" },
            { letter: "G", word: "gwiazda", emoji: "⭐" },
            { letter: "J", word: "jabłko", emoji: "🍎" },
            { letter: "K", word: "kot", emoji: "🐱" },
            { letter: "L", word: "lód", emoji: "🍦" },
            { letter: "M", word: "mysz", emoji: "🐭" },
            { letter: "P", word: "pies", emoji: "🐶" },
            { letter: "R", word: "ryba", emoji: "🐟" },
            { letter: "S", word: "słoń", emoji: "🐘" },
            { letter: "T", word: "tort", emoji: "🎂" },
            { letter: "Z", word: "zegar", emoji: "⏰" },
            { letter: "Ż", word: "żaba", emoji: "🐸" }
        ];

        let currentQuestion = null;
        let isSpeaking = false;

        // Funkcja do czytania tekstu na głos (Web Speech API)
        function speakText(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Przerwij poprzednie mówienie
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pl-PL';
                utterance.rate = 0.85; // Nieco wolniej dla dzieci
                utterance.pitch = 1.2; // Nieco wyższy, bardziej przyjazny ton
                
                utterance.onend = function() {
                    if(callback) callback();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                if(callback) callback();
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            speakText("Zaczynamy zabawę! Dopasuj obrazek do literki.", nextTurn);
        }

        function repeatAudio() {
            if (currentQuestion) {
                speakText(`Litera ${currentQuestion.letter}. Jak ${currentQuestion.word}.`);
            }
        }

        function nextTurn() {
            // 1. Wybierz losową poprawną literę
            const correctIndex = Math.floor(Math.random() * alphabetData.length);
            currentQuestion = alphabetData[correctIndex];

            // 2. Wybierz dwie losowe błędne opcje
            let options = [currentQuestion];
            while (options.length < 3) {
                const randomWrong = alphabetData[Math.floor(Math.random() * alphabetData.length)];
                if (!options.includes(randomWrong)) {
                    options.push(randomWrong);
                }
            }

            // 3. Wymieszaj opcje
            options.sort(() => Math.random() - 0.5);

            // 4. Zaktualizuj interfejs (pokaż dużą i małą literę, np. "A a")
            const letterEl = document.getElementById('current-letter');
            letterEl.textContent = `${currentQuestion.letter} ${currentQuestion.letter.toLowerCase()}`;
            
            // Animacja wejścia litery
            letterEl.style.animation = 'none';
            letterEl.offsetHeight; /* trigger reflow */
            letterEl.style.animation = 'bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            // 5. Wygeneruj przyciski
            options.forEach(option => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.textContent = option.emoji;
                card.onclick = () => handleAnswer(card, option);
                optionsContainer.appendChild(card);
            });

            // 6. Przeczytaj polecenie
            setTimeout(() => {
                speakText(`Gdzie jest ${currentQuestion.word}?`);
            }, 500);
        }

        function handleAnswer(cardElement, selectedOption) {
            if (selectedOption.letter === currentQuestion.letter) {
                // Dobra odpowiedź
                cardElement.classList.add('correct');
                
                // Konfetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff6b6b', '#4ecdc4', '#ffe66d']
                });

                speakText("Wspaniale! " + currentQuestion.word, () => {
                    setTimeout(nextTurn, 1000);
                });
            } else {
                // Zła odpowiedź
                cardElement.classList.add('wrong');
                speakText("Spróbuj jeszcze raz.");
                
                // Usuń klasę błędu po animacji by móc powtórzyć
                setTimeout(() => {
                    cardElement.classList.remove('wrong');
                }, 500);
            }
        }
    </script>
</body>
</html>
