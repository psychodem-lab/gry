<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zgadnij Kto To! - Wektorowe Twarze (2 Graczy)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 980px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .status-bar {
            background: #e0f2fe;
            border: 2px solid #bae6fd;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: 600;
        }

        .my-secret {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
        }

        .secret-avatar-mini {
            width: 32px;
            height: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 14px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 220px;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .card.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.35);
        }

        .card.eliminated {
            opacity: 0.25;
            filter: grayscale(100%);
            background: #f1f5f9;
        }

        .card.eliminated::after {
            content: "✖";
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            color: var(--accent);
            font-weight: bold;
        }

        .card-avatar {
            width: 85px;
            height: 85px;
            margin-bottom: 6px;
        }

        .card-name {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.72rem;
            color: #475569;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .btn-guess {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.78rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-guess:hover {
            background: var(--accent-hover);
        }

        .controls {
            text-align: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .pass-screen, .win-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .pass-screen h2, .win-screen h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary-dark);
        }

        .pass-screen p, .win-screen p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #4b5563;
        }

        /* Modal popup */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 12px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .instruction {
            background: #fffbe3;
            border: 1px solid #fde047;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container" id="app">
    <!-- Dynamiczny widok JS -->
</div>

<script>
    // Baza 16 dopracowanych postaci (z informacjami do generatora grafiki SVG)
    const CHARACTERS = [
        { id: 1, name: "Mei", desc: "Kobieta | Azjatycka<br>Ciemne włosy | 👓 Okulary", skin: "#f3d19e", eyeShape: "asian", glasses: true, hairStyle: "straight-dark", hairColor: "#111827" },
        { id: 2, name: "Kenji", desc: "Mężczyzna | Azjatycki<br>Ciemne włosy | 🚫 Bez okularów", skin: "#f3d19e", eyeShape: "asian", glasses: false, hairStyle: "short-dark", hairColor: "#111827" },
        { id: 3, name: "Amara", desc: "Kobieta | Afrykańska<br>Ciemne kręcone | 👓 Okulary", skin: "#583219", eyeShape: "round", glasses: true, hairStyle: "afro-dark", hairColor: "#0f172a" },
        { id: 4, name: "Kofi", desc: "Mężczyzna | Afrykański<br>Ciemne krótkie | 🚫 Bez okularów", skin: "#4a2a15", eyeShape: "round", glasses: false, hairStyle: "short-dark", hairColor: "#0f172a" },
        { id: 5, name: "Ewa", desc: "Kobieta | Europejska<br>Ciemne kręcone | 👓 Okulary", skin: "#fcd5ce", eyeShape: "round", glasses: true, hairStyle: "curly-dark", hairColor: "#1e1b18" },
        { id: 6, name: "Piotr", desc: "Mężczyzna | Europejski<br>Ciemne włosy + Broda | 🚫 Bez okularów", skin: "#fcd5ce", eyeShape: "round", glasses: false, hairStyle: "short-dark", hairColor: "#1e1b18", beard: true },
        { id: 7, name: "Yuki", desc: "Kobieta | Azjatycka<br>Rude włosy | 🚫 Bez okularów", skin: "#fae0c8", eyeShape: "asian", glasses: false, hairStyle: "long-red", hairColor: "#b93814" },
        { id: 8, name: "Tariq", desc: "Mężczyzna | Arabski<br>Ciemne włosy | 👓 Okulary", skin: "#c68642", eyeShape: "round", glasses: true, hairStyle: "short-dark", hairColor: "#111827" },
        { id: 9, name: "Zola", desc: "Kobieta | Afrykańska<br>Łysa | 🚫 Bez okularów", skin: "#583219", eyeShape: "round", glasses: false, hairStyle: "bald", hairColor: "none" },
        { id: 10, name: "Lukas", desc: "Mężczyzna | Europejski<br>Rude włosy | 👓 Okulary", skin: "#ffdfd3", eyeShape: "round", glasses: true, hairStyle: "short-red", hairColor: "#b93814" },
        { id: 11, name: "Li", desc: "Mężczyzna | Azjatycki<br>Łysy | 👓 Okulary", skin: "#f3d19e", eyeShape: "asian", glasses: true, hairStyle: "bald", hairColor: "none" },
        { id: 12, name: "Amina", desc: "Kobieta | Afrykańska<br>Ciemne długie | 🚫 Bez okularów", skin: "#4a2a15", eyeShape: "round", glasses: false, hairStyle: "long-dark", hairColor: "#0f172a" },
        { id: 13, name: "Kwame", desc: "Mężczyzna | Afrykański<br>Łysy | 🚫 Bez okularów", skin: "#3d2211", eyeShape: "round", glasses: false, hairStyle: "bald", hairColor: "none" },
        { id: 14, name: "Sophie", desc: "Kobieta | Europejska<br>Blond włosy | 🚫 Bez okularów", skin: "#ffdfd3", eyeShape: "round", glasses: false, hairStyle: "long-blond", hairColor: "#eab308" },
        { id: 15, name: "Carlos", desc: "Mężczyzna | Latynos<br>Ciemne włosy | 🚫 Bez okularów", skin: "#d4a373", eyeShape: "round", glasses: false, hairStyle: "short-dark", hairColor: "#18181b" },
        { id: 16, name: "Anna", desc: "Kobieta | Europejska<br>Ciemne proste | 🚫 Bez okularów", skin: "#fcd5ce", eyeShape: "round", glasses: false, hairStyle: "long-dark", hairColor: "#18181b" }
    ];

    // Generator wektorowej twarzy SVG (Tylko głowa/twarz - brak torsu)
    function createFaceSVG(char) {
        const skin = char.skin;
        const isAsian = char.eyeShape === 'asian';
        const hasGlasses = char.glasses;
        const hairStyle = char.hairStyle;
        const hairColor = char.hairColor;
        
        let svg = `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
        
        // Tło kółka dla ładnego kadru
        svg += `<circle cx="50" cy="50" r="48" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>`;
        
        // Uszy
        svg += `<ellipse cx="18" cy="52" rx="5" ry="8" fill="${skin}" />`;
        svg += `<ellipse cx="82" cy="52" rx="5" ry="8" fill="${skin}" />`;

        // Tłowe włosy (dla długich fryzur i afro)
        if (hairStyle === 'long-dark' || hairStyle === 'long-red' || hairStyle === 'long-blond' || hairStyle === 'curly-dark' || hairStyle === 'afro-dark') {
            if (hairStyle === 'afro-dark') {
                svg += `<circle cx="50" cy="46" r="37" fill="${hairColor}" />`;
            } else if (hairStyle === 'curly-dark') {
                svg += `<circle cx="28" cy="42" r="16" fill="${hairColor}" />`;
                svg += `<circle cx="72" cy="42" r="16" fill="${hairColor}" />`;
                svg += `<circle cx="50" cy="28" r="22" fill="${hairColor}" />`;
            } else {
                svg += `<path d="M 18 45 C 15 75, 25 86, 32 86 L 68 86 C 75 86, 85 75, 82 45 Z" fill="${hairColor}" />`;
            }
        }

        // Głowa / Twarz
        svg += `<ellipse cx="50" cy="52" rx="30" ry="36" fill="${skin}" />`;

        // Oczy
        if (isAsian) {
            // Oczy skośne (migdałowe)
            svg += `<path d="M 32 47 Q 40 42 46 47 Q 40 49 32 47 Z" fill="#1f2937" />`;
            svg += `<path d="M 54 47 Q 60 42 68 47 Q 60 49 54 47 Z" fill="#1f2937" />`;
            // Brwi
            svg += `<path d="M 32 41 Q 39 37 46 42" stroke="${hairColor !== 'none' ? hairColor : '#333'}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
            svg += `<path d="M 54 42 Q 61 37 68 41" stroke="${hairColor !== 'none' ? hairColor : '#333'}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
        } else {
            // Oczy okrągłe
            svg += `<circle cx="37" cy="47" r="4" fill="#1f2937" />`;
            svg += `<circle cx="63" cy="47" r="4" fill="#1f2937" />`;
            svg += `<circle cx="38.5" cy="45.5" r="1.3" fill="#ffffff" />`;
            svg += `<circle cx="64.5" cy="45.5" r="1.3" fill="#ffffff" />`;
            // Brwi
            svg += `<path d="M 30 40 Q 37 36 44 40" stroke="${hairColor !== 'none' ? hairColor : '#333'}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
            svg += `<path d="M 56 40 Q 63 36 70 40" stroke="${hairColor !== 'none' ? hairColor : '#333'}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
        }

        // Nos
        svg += `<path d="M 48 56 Q 50 59 52 56" stroke="rgba(0,0,0,0.25)" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;

        // Usta
        svg += `<path d="M 42 68 Q 50 75 58 68" stroke="#a23b38" stroke-width="3" fill="none" stroke-linecap="round"/>`;

        // Broda (jeśli dotyczy)
        if (char.beard) {
            svg += `<path d="M 23 58 C 23 85, 77 85, 77 58 C 68 76, 32 76, 23 58 Z" fill="${hairColor}" />`;
        }

        // Włosy przednie / Grzywka
        if (hairStyle === 'short-dark' || hairStyle === 'short-red') {
            svg += `<path d="M 20 50 C 20 20, 80 20, 80 50 C 72 32, 28 32, 20 50 Z" fill="${hairColor}" />`;
        } else if (hairStyle === 'straight-dark' || hairStyle === 'long-dark' || hairStyle === 'long-red' || hairStyle === 'long-blond') {
            svg += `<path d="M 20 45 C 20 20, 80 20, 80 45 C 68 30, 32 30, 20 45 Z" fill="${hairColor}" />`;
        } else if (hairStyle === 'curly-dark' || hairStyle === 'afro-dark') {
            svg += `<circle cx="38" cy="25" r="12" fill="${hairColor}" />`;
            svg += `<circle cx="50" cy="21" r="13" fill="${hairColor}" />`;
            svg += `<circle cx="62" cy="25" r="12" fill="${hairColor}" />`;
        } else if (hairStyle === 'bald') {
            // Blask na łysinie
            svg += `<path d="M 35 25 Q 45 20 55 24" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
        }

        // RYSOWANIE OKULARÓW (Jeśli postać ma okulary)
        if (hasGlasses) {
            // Lewa soczewka
            svg += `<rect x="25" y="38" width="21" height="17" rx="4" fill="rgba(255,255,255,0.3)" stroke="#0f172a" stroke-width="3"/>`;
            // Prawa soczewka
            svg += `<rect x="54" y="38" width="21" height="17" rx="4" fill="rgba(255,255,255,0.3)" stroke="#0f172a" stroke-width="3"/>`;
            // Mostek
            svg += `<line x1="46" y1="45" x2="54" y2="45" stroke="#0f172a" stroke-width="3"/>`;
            // Zauszniki
            svg += `<line x1="18" y1="44" x2="25" y2="44" stroke="#0f172a" stroke-width="2.5"/>`;
            svg += `<line x1="75" y1="44" x2="82" y2="44" stroke="#0f172a" stroke-width="2.5"/>`;
            // Błysk/odbicie na szkle
            svg += `<line x1="28" y1="41" x2="35" y2="52" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>`;
            svg += `<line x1="57" y1="41" x2="64" y2="52" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round"/>`;
        }

        svg += `</svg>`;
        return svg;
    }

    // Stan gry
    let state = {
        step: 'P1_SELECT', // P1_SELECT, PASS_TO_P2, P2_SELECT, PASS_TO_GAME, PLAY_TURN, PASS_TURN, WIN
        p1Secret: null,
        p2Secret: null,
        p1Eliminated: [],
        p2Eliminated: [],
        activePlayer: 1,
        tempSelectedId: null,
        guessConfirmCard: null,
        winner: null,
        winReason: ''
    };

    function render() {
        const app = document.getElementById('app');
        app.innerHTML = '';

        if (state.step === 'P1_SELECT') {
            app.appendChild(renderSelectScreen(1));
        } else if (state.step === 'PASS_TO_P2') {
            app.appendChild(renderPassScreen('Przekaż urządzenie Graczowi 2', 'Jestem Graczem 2', () => {
                state.step = 'P2_SELECT';
                state.tempSelectedId = null;
                render();
            }));
        } else if (state.step === 'P2_SELECT') {
            app.appendChild(renderSelectScreen(2));
        } else if (state.step === 'PASS_TO_GAME') {
            app.appendChild(renderPassScreen('Wszystko gotowe! Przekaż urządzenie Graczowi 1', 'Rozpocznij Grę (Tura Gracza 1)', () => {
                state.activePlayer = 1;
                state.step = 'PLAY_TURN';
                render();
            }));
        } else if (state.step === 'PLAY_TURN') {
            app.appendChild(renderBoard());
        } else if (state.step === 'PASS_TURN') {
            const nextPlayer = state.activePlayer === 1 ? 2 : 1;
            app.appendChild(renderPassScreen(`Koniec tury. Przekaż urządzenie Graczowi ${nextPlayer}`, `Rozpocznij Turę Gracza ${nextPlayer}`, () => {
                state.activePlayer = nextPlayer;
                state.step = 'PLAY_TURN';
                render();
            }));
        } else if (state.step === 'WIN') {
            app.appendChild(renderWinScreen());
        }

        // Renderowanie okna modalnego potwierdzenia zgadnięcia
        if (state.guessConfirmCard) {
            app.appendChild(renderGuessModal());
        }
    }

    // Ekran wyboru tajnej postaci
    function renderSelectScreen(playerNum) {
        const container = document.createElement('div');
        
        const header = document.createElement('header');
        header.innerHTML = `
            <h1>Gracz ${playerNum}: Wybierz swoją postać</h1>
            <p>Drugi gracz nie może patrzeć! Kliknij postać, którą przeciwnik będzie musiał odgadnąć.</p>
        `;
        container.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'grid';

        CHARACTERS.forEach(char => {
            const card = document.createElement('div');
            card.className = `card ${state.tempSelectedId === char.id ? 'selected' : ''}`;
            card.innerHTML = `
                <div class="card-avatar">${createFaceSVG(char)}</div>
                <div class="card-name">${char.name}</div>
                <div class="card-desc">${char.desc}</div>
            `;
            card.onclick = () => {
                state.tempSelectedId = char.id;
                render();
            };
            grid.appendChild(card);
        });

        container.appendChild(grid);

        const controls = document.createElement('div');
        controls.className = 'controls';
        
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Zatwierdź wybór';
        btn.disabled = !state.tempSelectedId;
        btn.onclick = () => {
            if (playerNum === 1) {
                state.p1Secret = CHARACTERS.find(c => c.id === state.tempSelectedId);
                state.step = 'PASS_TO_P2';
            } else {
                state.p2Secret = CHARACTERS.find(c => c.id === state.tempSelectedId);
                state.step = 'PASS_TO_GAME';
            }
            render();
        };

        controls.appendChild(btn);
        container.appendChild(controls);

        return container;
    }

    // Ekran przejściowy (zasłona)
    function renderPassScreen(title, btnText, onConfirm) {
        const div = document.createElement('div');
        div.className = 'pass-screen';
        div.innerHTML = `
            <h2>🙈 Zasłoń ekran!</h2>
            <p>${title}</p>
        `;
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = btnText;
        btn.onclick = onConfirm;
        div.appendChild(btn);
        return div;
    }

    // Główna plansza do gry
    function renderBoard() {
        const container = document.createElement('div');
        const activeP = state.activePlayer;
        const mySecret = activeP === 1 ? state.p1Secret : state.p2Secret;
        const eliminatedList = activeP === 1 ? state.p1Eliminated : state.p2Eliminated;

        // Pasek statusu
        const statusBar = document.createElement('div');
        statusBar.className = 'status-bar';
        statusBar.innerHTML = `
            <div>Tura: <strong style="color: var(--primary-dark)">Gracz ${activeP}</strong></div>
            <div class="my-secret">
                <span>Twoja postać:</span>
                <div class="secret-avatar-mini">${createFaceSVG(mySecret)}</div>
                <strong>${mySecret.name}</strong>
            </div>
        `;
        container.appendChild(statusBar);

        const instruction = document.createElement('div');
        instruction.className = 'instruction';
        instruction.innerHTML = `💡 <b>Jak grać:</b> Zadaj pytanie na żywo (np. <i>"Czy Twoja postać ma okulary?"</i> lub <i>"Czy ma ciemne włosy?"</i>). Na podstawie odpowiedzi klikaj postacie, aby je <b>odrzucić</b>. Gdy jesteś pewny – kliknij <b>"Zgadnij!"</b>.`;
        container.appendChild(instruction);

        // Siatka postaci
        const grid = document.createElement('div');
        grid.className = 'grid';

        CHARACTERS.forEach(char => {
            const isEliminated = eliminatedList.includes(char.id);
            const card = document.createElement('div');
            card.className = `card ${isEliminated ? 'eliminated' : ''}`;
            
            card.innerHTML = `
                <div class="card-avatar">${createFaceSVG(char)}</div>
                <div class="card-name">${char.name}</div>
                <div class="card-desc">${char.desc}</div>
            `;

            // Kliknięcie w kartę eliminuje / przywraca ją
            card.onclick = () => {
                if (isEliminated) {
                    const idx = eliminatedList.indexOf(char.id);
                    eliminatedList.splice(idx, 1);
                } else {
                    eliminatedList.push(char.id);
                }
                render();
            };

            // Przycisk "Zgadnij"
            const guessBtn = document.createElement('button');
            guessBtn.className = 'btn-guess';
            guessBtn.innerText = 'Zgadnij!';
            guessBtn.onclick = (e) => {
                e.stopPropagation();
                state.guessConfirmCard = char;
                render();
            };

            card.appendChild(guessBtn);
            grid.appendChild(card);
        });

        container.appendChild(grid);

        // Kontrolki na dole
        const controls = document.createElement('div');
        controls.className = 'controls';
        
        const endTurnBtn = document.createElement('button');
        endTurnBtn.className = 'btn';
        endTurnBtn.innerText = 'Zakończ swoją turę ➡️';
        endTurnBtn.onclick = () => {
            state.step = 'PASS_TURN';
            render();
        };

        controls.appendChild(endTurnBtn);
        container.appendChild(controls);

        return container;
    }

    // Modal potwierdzenia zgadywania
    function renderGuessModal() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';

        const modal = document.createElement('div');
        modal.className = 'modal';

        const char = state.guessConfirmCard;
        const opponentP = state.activePlayer === 1 ? 2 : 1;
        const opponentSecret = state.activePlayer === 1 ? state.p2Secret : state.p1Secret;

        modal.innerHTML = `
            <h3>Czy na pewno typujesz?</h3>
            <p>Uważasz, że tajemnicza postać Gracza ${opponentP} to:</p>
            <div style="width: 100px; height: 100px; margin: 15px auto;">${createFaceSVG(char)}</div>
            <h2>${char.name}</h2>
            <p style="font-size:0.85rem; color:#ef4444; margin-top:10px;">⚠️ Uwaga! Jeśli się pomylisz, natychmiast przegrywasz!</p>
        `;

        const btns = document.createElement('div');
        btns.className = 'modal-btns';

        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn';
        confirmBtn.innerText = 'Tak, to ta postać!';
        confirmBtn.onclick = () => {
            if (char.id === opponentSecret.id) {
                state.winner = state.activePlayer;
                state.winReason = `Gracz ${state.activePlayer} poprawnie zgadł postać: ${char.name}!`;
            } else {
                state.winner = opponentP;
                state.winReason = `Gracz ${state.activePlayer} wytypował błędnie (${char.name}). Tajemniczą postacią Gracza ${opponentP} był(a) ${opponentSecret.name}!`;
            }
            state.guessConfirmCard = null;
            state.step = 'WIN';
            render();
        };

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn btn-secondary';
        cancelBtn.innerText = 'Anuluj';
        cancelBtn.onclick = () => {
            state.guessConfirmCard = null;
            render();
        };

        btns.appendChild(confirmBtn);
        btns.appendChild(cancelBtn);
        modal.appendChild(btns);
        overlay.appendChild(modal);

        return overlay;
    }

    // Ekran wygranej
    function renderWinScreen() {
        const div = document.createElement('div');
        div.className = 'win-screen';

        div.innerHTML = `
            <h2>🏆 Gracz ${state.winner} Wygrywa!</h2>
            <p>${state.winReason}</p>
            
            <div style="display: flex; justify-content: center; gap: 40px; margin: 30px 0;">
                <div>
                    <h4>Postać Gracza 1:</h4>
                    <div style="width: 110px; height: 110px; margin: 10px auto;">${createFaceSVG(state.p1Secret)}</div>
                    <strong>${state.p1Secret.name}</strong>
                </div>
                <div>
                    <h4>Postać Gracza 2:</h4>
                    <div style="width: 110px; height: 110px; margin: 10px auto;">${createFaceSVG(state.p2Secret)}</div>
                    <strong>${state.p2Secret.name}</strong>
                </div>
            </div>
        `;

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Zagraj ponownie 🔄';
        btn.onclick = () => {
            state = {
                step: 'P1_SELECT',
                p1Secret: null,
                p2Secret: null,
                p1Eliminated: [],
                p2Eliminated: [],
                activePlayer: 1,
                tempSelectedId: null,
                guessConfirmCard: null,
                winner: null,
                winReason: ''
            };
            render();
        };

        div.appendChild(btn);
        return div;
    }

    // Pierwsze uruchomienie
    render();
</script>

</body>
</html>
