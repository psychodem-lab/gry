<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EDF0EB">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F8A73'/%3E%3Ccircle cx='19' cy='45' r='7' fill='white'/%3E%3Cpath d='M11 27a26 26 0 0 1 26 26' stroke='white' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M11 13a40 40 0 0 1 40 40' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' opacity='.65'/%3E%3C/svg%3E">
    <title>Czytnik Wiadomości</title>
    <style>
:root{--bg:#EDF0EB;--surface:#F9FAF7;--ink:#2B3733;--muted:#71807A;--line:#D9DFD8;--accent:#4F8A73;--on-accent:#fff;--soft:#E7EEE7;--chip:#DCEBE2;--chip-ink:#2F6350;--err:#B5503F;--shadow:0 10px 30px -14px rgba(43,55,51,.35)}
:root[data-theme="dark"]{--bg:#131A18;--surface:#1B2421;--ink:#E4EBE6;--muted:#8C9A93;--line:#2A3631;--accent:#7CBFA3;--on-accent:#10201A;--soft:#212D29;--chip:#2A4136;--chip-ink:#BFE3D2;--err:#EE9686;--shadow:0 10px 30px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .4s,color .4s}
.container{max-width:680px;margin:0 auto;padding:0 16px max(32px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.65rem;font-weight:800}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,transform .12s}
.round:hover{background:var(--soft)}.round:active{transform:scale(.9)}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ico-sun{display:none}[data-theme="dark"] #ico-sun{display:block}[data-theme="dark"] #ico-moon{display:none}
nav{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:4px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;min-height:42px;padding:0 18px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap;transition:background .25s,color .25s}
nav button.active{background:var(--accent);color:var(--on-accent)}
.loader{display:none;text-align:center;color:var(--muted);font-weight:600;margin:60px 0}
.loader::before{content:"";display:block;width:28px;height:28px;margin:0 auto 14px;border:3px solid var(--soft);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.feed-container{display:flex;flex-direction:column;gap:14px}
.new-pill{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:30;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:.9rem;border-radius:99px;padding:12px 20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-pill.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.new-pill:active{transform:translateX(-50%) scale(.96)}
article{position:relative;background:var(--surface);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow);animation:fadeIn .4s ease both;transition:transform .12s}
article:active{transform:scale(.99)}
.article-meta{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.article-title{margin:0 0 8px;font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;font-weight:600;line-height:1.35}
.article-title a{color:var(--ink);text-decoration:none}
.article-title a::after{content:"";position:absolute;inset:0;border-radius:20px}
.article-description{margin:0;color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.error-msg,.text-muted{color:var(--err);font-weight:600;font-size:.95rem;line-height:1.5}
.text-muted{color:var(--muted);text-align:center;margin-top:40px}
.cal{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);color:var(--muted);font-size:.95rem}
.cal strong{color:var(--ink)}
.cal-date{margin:0 0 4px;font-size:1.45rem;font-weight:800;line-height:1.25;color:var(--ink)}
.cal-sub{margin:0 0 16px;font-size:.88rem}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cal-box{background:var(--soft);border-radius:14px;padding:14px}
.cal-box+.cal-box{margin-top:0}.cal>.cal-box{margin-top:12px}
.cal ul{margin:6px 0 0 18px;padding:0}
.cal-quote{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--chip);color:var(--chip-ink)}
.cal-quote em{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

    <div class="container">
        <header translate="no">
            <div class="top"><h1>Wiadomości</h1>
                <button class="round" onclick="toggleTheme()" aria-label="Zmień motyw">
                    <svg id="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
                    <svg id="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button></div>
            <nav>
                <button onclick="loadFeed('kalendarz')" id="btn-kalendarz" class="active">Kalendarz</button>
                <button onclick="loadFeed('polska')" id="btn-polska">Polska</button>
                <button onclick="loadFeed('wykop')" id="btn-wykop">Wykop</button>
                <button onclick="loadFeed('sciencedaily')" id="btn-sciencedaily">ScienceDaily</button>
                <button onclick="loadFeed('cnn')" id="btn-cnn">Świat</button>
            </nav>
        </header>
        
        <div id="loader" class="loader" translate="no">Wczytywanie artykułów...</div>
        <main id="feed" class="feed-container"></main>
        <button id="newPill" class="new-pill" hidden></button>
    </div>

    <script>
        // Mapa źródeł RSS z czytelnymi nazwami
        const feedSources = {
            
            'https://www.sciencedaily.com/rss/all.xml': 'ScienceDaily All',
            'https://www.sciencedaily.com/rss/mind_brain.xml': 'ScienceDaily Mind & Brain',
            'https://www.sciencedaily.com/rss/space_time.xml': 'ScienceDaily Space & Time',
            'https://www.sciencedaily.com/rss/matter_energy.xml': 'ScienceDaily Matter & Energy',
            'https://www.sciencedaily.com/rss/computers_math.xml': 'ScienceDaily Computers & Math',
            'https://www.sciencedaily.com/rss/health_medicine.xml': 'ScienceDaily Health',
            'https://pap-mediaroom.pl/kategoria/zdrowie-i-styl-zycia/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/nauka-i-technologie/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/ludzie-i-kultura/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/polityka-i-społeczenstwo/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kategoria/biznes-i-finanse/rss.xml': 'PAP',
            'https://pap-mediaroom.pl/kalendarium/rss.xml': 'PAP',
            'http://feeds.bbci.co.uk/news/rss.xml': 'BBC News',
            'https://www.aljazeera.com/xml/rss/all.xml': 'Al Jazeera English',
            'https://www.theguardian.com/world/rss': 'The Guardian World',
            'https://rss.dw.com/xml/rss-en-world': 'DW World',
            'https://www.france24.com/en/rss': 'France 24 English',
            'https://feeds.npr.org/1001/rss.xml': 'NPR News',
            'https://feeds.skynews.com/feeds/rss/world.xml': 'Sky News World',
            'https://feeds.feedburner.com/euronews/en/news': 'Euronews',
            'https://www.polsatnews.pl/rss/wszystkie.xml': 'Polsat News',
            'https://wykop.pl/rss': 'Wykop',
            'https://zerkaj.pl/feed.rss': 'Zerkaj',
            'https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl': 'Google News',
            'https://news.google.com/rss/search?q=kalendarz+swiat+polska&hl=pl&gl=PL&ceid=PL:pl': 'Google News',
            'https://www.rynekzdrowia.pl/Kanal/all.xml': 'Rynek Zdrowia',
            'https://news.google.com/rss/search?q=%C5%9bwieta+nietypowe+dzisiaj+kalendarz&hl=pl&gl=PL&ceid=PL:pl': 'Kalendarz Świąt',
            'https://news.google.com/rss/search?q=imieniny+dzisiaj+kalendarz&hl=pl&gl=PL&ceid=PL:pl': 'Imieniny i Święta',
            'https://news.google.com/rss/search?q=wydarzenia+historyczne+dnia+kalendarz&hl=pl&gl=PL&ceid=PL:pl': 'Wydarzenia Historyczne',
            'https://news.google.com/rss/search?q=%C5%9bwieta+pa%C5%84stwowe+i+ko%C5%bccielne&hl=pl&gl=PL&ceid=PL:pl': 'Kalendarz Państwowy'
        };

        const feeds = {
            kalendarz: [
                'https://news.google.com/rss/search?q=%C5%9bwieta+nietypowe+dzisiaj+kalendarz&hl=pl&gl=PL&ceid=PL:pl',
                'https://news.google.com/rss/search?q=imieniny+dzisiaj+kalendarz&hl=pl&gl=PL&ceid=PL:pl',
                'https://news.google.com/rss/search?q=wydarzenia+historyczne+dnia+kalendarz&hl=pl&gl=PL&ceid=PL:pl',
                'https://news.google.com/rss/search?q=%C5%9bwieta+pa%C5%84stwowe+i+ko%C5%bccielne&hl=pl&gl=PL&ceid=PL:pl',
                'https://pap-mediaroom.pl/kalendarium/rss.xml',
                'https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl'
            ],
            polska: [
                'https://pap-mediaroom.pl/kategoria/zdrowie-i-styl-zycia/rss.xml', 
                'https://pap-mediaroom.pl/kategoria/nauka-i-technologie/rss.xml',
                'https://pap-mediaroom.pl/kategoria/ludzie-i-kultura/rss.xml',
                'https://pap-mediaroom.pl/kategoria/polityka-i-społeczenstwo/rss.xml',
                'https://pap-mediaroom.pl/kategoria/biznes-i-finanse/rss.xml',
                'https://pap-mediaroom.pl/kalendarium/rss.xml',
                'https://www.polsatnews.pl/rss/wszystkie.xml',  
                'https://news.google.com/rss/search?q=kalendarz+swiat+polska&hl=pl&gl=PL&ceid=PL:pl',
                'https://www.rynekzdrowia.pl/Kanal/all.xml'
            ],
            wykop: [
                'https://wykop.pl/rss',
                'https://zerkaj.pl/feed.rss'
            ],
            sciencedaily: [
                
                'https://www.sciencedaily.com/rss/all.xml',
                'https://www.sciencedaily.com/rss/mind_brain.xml',
                'https://www.sciencedaily.com/rss/space_time.xml',
                'https://www.sciencedaily.com/rss/matter_energy.xml',
                'https://www.sciencedaily.com/rss/computers_math.xml',
                'https://www.sciencedaily.com/rss/health_medicine.xml'
            ],
            cnn: [
                'http://feeds.bbci.co.uk/news/rss.xml',
                'https://www.aljazeera.com/xml/rss/all.xml',
                'https://www.theguardian.com/world/rss',
                'https://rss.dw.com/xml/rss-en-world',
                'https://www.france24.com/en/rss',
                'https://feeds.npr.org/1001/rss.xml',
                'https://feeds.skynews.com/feeds/rss/world.xml',
                'https://feeds.feedburner.com/euronews/en/news'
            ]
        };

        // Pamięć podręczna (cache) dla błyskawicznego otwierania zakładek
        const feedCache = {};
        let currentItems = [];
        let displayedCount = 0;
        let currentSourceKey = '';
        const batchSize = 10;

        // --- CACHE NA DYSKU (localStorage, żeby nie zajeżdżać API przy każdym odświeżeniu) ---
        const CACHE_TTL = 15 * 60 * 1000;
        function loadDiskCache(key) {
            try {
                const raw = localStorage.getItem('czytnik_' + key);
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.items)) return null;
                if (Date.now() - data.ts > CACHE_TTL) return null;
                return data.items;
            } catch (e) { return null; }
        }
        function saveDiskCache(key, items) {
            try { localStorage.setItem('czytnik_' + key, JSON.stringify({ ts: Date.now(), items: items.slice(0, 80) })); } catch (e) {}
        }
        // Odtwórz cache z dysku przy starcie (natychmiastowe zakładki + mniej requestów do API)
        try {
            for (const k of Object.keys(feeds)) {
                const disk = loadDiskCache(k);
                if (disk && disk.length) feedCache[k] = disk;
            }
        } catch (e) {}

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // Fetch z twardym limitem czasu — wiszący proxy nie blokuje zakładki
        async function fetchTimeout(url, ms = 10000, options = {}) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try {
                return await fetch(url, { ...options, signal: ctrl.signal });
            } finally { clearTimeout(t); }
        }

        // --- ODPORNE POBIERANIE RSS jak w Inoreader: łańcuch proxy + fallback Google News ---
        // Kolejność: rss2json → AllOrigins → corsproxy.io → Google News (site:domena)
        function parseRssXml(xmlText, sourceName) {
            try {
                const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
                if (doc.querySelector('parsererror')) return null;
                // RSS <item> i Atom <entry>
                const nodes = [...doc.querySelectorAll('item'), ...doc.querySelectorAll('entry')].slice(0, 25);
                const txt = (n, sels) => {
                    for (const s of sels) {
                        const el = n.querySelector(s);
                        if (el && el.textContent && el.textContent.trim()) return el.textContent.trim();
                    }
                    return '';
                };
                const out = nodes.map(n => {
                    let link = txt(n, ['link']);
                    // Atom: <link href="..."/>
                    if ((!link || link.length < 8) && n.querySelector('link')) {
                        link = n.querySelector('link').getAttribute('href') || '';
                    }
                    if (!link) link = txt(n, ['guid', 'id', 'url']);
                    return {
                        title: txt(n, ['title']),
                        link: (link || '').trim(),
                        pubDate: txt(n, ['pubDate', 'pubdate', 'updated', 'published', 'date', 'dc\\:date']),
                        description: txt(n, ['description', 'summary', 'content', 'encoded', 'content\\:encoded']),
                        sourceName
                    };
                }).filter(x => x.title && x.link);
                return out.length ? out : null;
            } catch (e) { return null; }
        }

        async function fetchXmlViaProxies(url) {
            // Równolegle: bierze pierwszy działający (szybciej niż po kolei)
            const viaAllOriginsGet = (async () => {
                try {
                    const r = await fetchTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, 10000);
                    if (!r.ok) return null;
                    const d = await r.json();
                    if (d && d.contents && d.contents.length > 200) return d.contents;
                } catch (e) {}
                return null;
            })();
            const viaCorsproxy = (async () => {
                try {
                    const r = await fetchTimeout(`https://corsproxy.io/?url=${encodeURIComponent(url)}`, 10000);
                    if (!r.ok) return null;
                    const t = await r.text();
                    if (t && t.length > 200 && t.includes('<')) return t;
                } catch (e) {}
                return null;
            })();
            const viaAllOriginsRaw = (async () => {
                try {
                    const r = await fetchTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, 10000);
                    if (!r.ok) return null;
                    const t = await r.text();
                    if (t && t.length > 200 && t.includes('<')) return t;
                } catch (e) {}
                return null;
            })();
            const results = await Promise.all([viaAllOriginsGet, viaCorsproxy, viaAllOriginsRaw]);
            return results.find(x => x) || null;
        }

        // Google News jako "czytnik zastępczy" dla stron bez RSS (jak Inoreader: site:domena)
        function domainToGoogleNewsUrl(feedUrl) {
            try {
                const u = new URL(feedUrl);
                let host = u.hostname.replace(/^www\./, '');
                // Dla Google News / inne agregatory fallback nie ma sensu
                if (host.includes('news.google.com') || host.includes('rss2json') || host.includes('allorigins')) return null;
                return `https://news.google.com/rss/search?q=site%3A${encodeURIComponent(host)}%20when%3A14d&hl=pl&gl=PL&ceid=PL%3Apl`;
            } catch (e) { return null; }
        }

        async function fetchRss2json(url) {
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    const response = await fetchTimeout(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`, 10000);
                    if (response.status === 429 || response.status === 500 || response.status === 502 || response.status === 503) {
                        await sleep(700);
                        continue;
                    }
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (data.status === 'ok' && data.items) return data;
                    return null;
                } catch (e) {
                    await sleep(500);
                }
            }
            return null;
        }

        async function fetchFeed(url) {
            const sourceName = feedSources[url] || 'Wiadomości';
            // 1. rss2json (najszybszy, gotowy JSON)
            const data = await fetchRss2json(url);
            if (data && data.items) {
                return data.items.map(item => ({ ...item, sourceName }));
            }
            // 2. Proxy + własny parsing XML (działa też dla Atom i feedów, które rss2json odrzuca)
            const xml = await fetchXmlViaProxies(url);
            if (xml) {
                const parsed = parseRssXml(xml, sourceName);
                if (parsed) return parsed;
            }
            // 3. Fallback jak w Inoreader: Google News dla domeny (strona wycięła RSS, a newsy i tak są)
            const gnUrl = domainToGoogleNewsUrl(url);
            if (gnUrl) {
                const gnData = await fetchRss2json(gnUrl);
                if (gnData && gnData.items) {
                    return gnData.items.map(item => ({ ...item, sourceName: sourceName + ' (via GN)' }));
                }
                const gnXml = await fetchXmlViaProxies(gnUrl);
                if (gnXml) {
                    const parsed = parseRssXml(gnXml, sourceName + ' (via GN)');
                    if (parsed) return parsed;
                }
            }
            return null;
        }

        async function fetchTabRaw(sourceKey, onBatch) {
            const urls = feeds[sourceKey] || [];
            // Równolegle + progresywnie: każdy feed dokłada się do listy w chwili spłynięcia,
            // onBatch dostaje posortowaną kopię całości (do malowania bez czekania na maruderów)
            let combined = [];
            const jobs = urls.map(u => fetchFeed(u).then(items => {
                if (!items || !items.length) return;
                combined = dedupeItems(combined.concat(items));
                if (onBatch && sourceKey === currentSourceKey && combined.length) {
                    onBatch(combined.slice());
                }
            }).catch(() => {}));
            await Promise.all(jobs);
            return combined;
        }

        // --- AUTOMATYCZNE TŁUMACZENIE NA JĘZYK POLSKI (leniwie: tylko widoczne artykuły) ---
        async function translateText(text) {
            if (!text) return '';
            const cleanText = text.replace(/<[^>]*>/g, '').trim();
            if (!cleanText) return '';
            try {
                const res = await fetchTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pl&dt=t&q=${encodeURIComponent(cleanText)}`, 8000);
                const data = await res.json();
                if (data && data[0]) {
                    return data[0].map(item => item[0]).join('');
                }
            } catch (e) {}
            return text;
        }

        // Źródła już po polsku — nie tłumacz (oszczędza ~20 requestów na batch i nie muli)
        const polishSources = new Set(['PAP', 'Polsat News', 'Polsat Sport', 'Rynek Zdrowia', 'Wykop', 'Zerkaj']);

        // Tłumaczy 1 artykuł raz (flaga _pl), żeby nie dublować requestów przy scrollu
        async function translateItem(item) {
            if (item._pl) return item;
            if (item.sourceName && polishSources.has(item.sourceName)) { item._pl = true; return item; }
            // Zachowaj oryginał — potrzebny do wykrywania duplikatów PL vs EN przy odświeżaniu
            if (item._orig === undefined) item._orig = item.title;
            try {
                if (item.title) item.title = await translateText(item.title);
                if (item.description) item.description = await translateText(item.description);
            } catch (e) {}
            item._pl = true;
            return item;
        }

        // --- POMOCNICZE FUNKCJE KALENDARZOWE NA ŻYWO ---
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function getMoonPhase(date) {
            // Obliczenia astronomiczne: cykl synodyczny 29.53058867 dni od nowiu 2000-01-06 18:14 UTC
            const synodic = 29.53058867;
            const known = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
            const days = date.getTime() / 86400000 - known;
            let age = days % synodic;
            if (age < 0) age += synodic;
            const illum = Math.round((1 - Math.cos(2 * Math.PI * age / synodic)) / 2 * 100);
            let name = '';
            if (age < 1.5 || age > synodic - 1.5) name = 'Nów 🌑';
            else if (age < 7.4) name = 'Dąży do pierwszej kwadry 🌒';
            else if (age < 8.9) name = 'Pierwsza kwadra 🌓';
            else if (age < 14.8) name = 'Dąży do pełni 🌔';
            else if (age < 16.3) name = 'Pełnia 🌕';
            else if (age < 22.2) name = 'Dąży do ostatniej kwadry 🌖';
            else if (age < 23.7) name = 'Ostatnia kwadra 🌗';
            else name = 'Dąży do nowiu 🌘';
            return { name, illum, age: Math.round(age * 10) / 10 };
        }

        async function fetchSunPL(date) {
            const iso = date.toISOString().split('T')[0];
            try {
                const r = await fetch(`https://api.sunrise-sunset.org/json?lat=49.784&lng=22.767&date=${iso}&formatted=0`);
                const d = await r.json();
                if (d?.status === 'OK' && d.results) {
                    const fmt = (s) => new Date(s).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
                    const sunrise = fmt(d.results.sunrise);
                    const sunset = fmt(d.results.sunset);
                    const secs = d.results.day_length;
                    const h = Math.floor(secs / 3600), m = Math.round((secs % 3600) / 60);
                    return { sunrise, sunset, len: `${h} godz. ${m} min` };
                }
            } catch (e) {}
            return null;
        }

        async function fetchHolidaysPL(date) {
            const year = date.getFullYear();
            try {
                const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/PL`);
                const d = await r.json();
                if (Array.isArray(d)) {
                    const todayStr = date.toISOString().split('T')[0];
                    const todayHol = d.filter(h => h.date === todayStr);
                    const upcoming = d.filter(h => h.date > todayStr).slice(0, 5).map(h => {
                        const hd = new Date(h.date + 'T00:00:00');
                        const diff = Math.ceil((hd - date) / 86400000);
                        const label = hd.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
                        return { label, name: h.localName || h.name, diff };
                    });
                    return { todayHol, upcoming };
                }
            } catch (e) {}
            return { todayHol: [], upcoming: [] };
        }

        async function fetchImieninyPL(date) {
            try {
                const day = date.getDate();
                const month = date.getMonth() + 1;
                const r = await fetchTimeout(`https://nameday.abalin.net/api/V2/date?day=${day}&month=${month}&country=pl`, 8000);
                const d = await r.json();
                const raw = d?.data?.pl || '';
                if (!raw) return null;
                // API zwraca duplikaty ("Danuta, ..., Danuta") — odduplikuj zachowując kolejność
                const seen = new Set();
                const out = [];
                for (const n of String(raw).split(',')) {
                    const t = n.trim();
                    if (t && !seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); out.push(t); }
                }
                return out.join(', ');
            } catch (e) {}
            return null;
        }

        async function fillCalendarWidget(today) {
            // Imieniny na żywo (nameday.abalin.net, darmowe, bez klucza, jak u Zerkaj)
            try {
                const names = await fetchImieninyPL(today);
                const elI = document.getElementById('cal-imieniny');
                if (elI) elI.textContent = names || 'Brak danych o imieninach.';
            } catch (e) {}
            // Słońce na żywo (Przemyśl, podkarpackie)
            try {
                const sun = await fetchSunPL(today);
                const el = document.getElementById('cal-sun');
                if (el && sun) el.innerHTML = `🌅 Wschód: ${sun.sunrise} &nbsp;|&nbsp; 🌇 Zachód: ${sun.sunset}<br>⏳ Długość dnia: ${sun.len}`;
            } catch (e) {}
            // Najbliższe święta państwowe na żywo
            try {
                const hol = await fetchHolidaysPL(today);
                const elN = document.getElementById('cal-najblizsze');
                if (elN && hol.upcoming.length > 0) {
                    elN.innerHTML = hol.upcoming.map(h => `<li><strong>${h.label}:</strong> ${h.name} (za ${h.diff} dni)</li>`).join('');
                } else if (elN) {
                    elN.innerHTML = '<li>Brak danych o nadchodzących świętach.</li>';
                }
            } catch (e) {}
        }

        // --- OBSŁUGA GESTÓW ---
        let touchTarget = null;
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchTarget = e.target;
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const diffX = touchendX - touchstartX;
            const diffY = touchendY - touchstartY;
            const swipeThreshold = 60;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold && !(touchTarget && touchTarget.closest && touchTarget.closest('nav'))) {
                const keys = Object.keys(feeds);
                const activeBtn = document.querySelector('nav button.active');
                if (!activeBtn) return;
                
                const currentKey = activeBtn.id.replace('btn-', '');
                let currentIndex = keys.indexOf(currentKey);
                
                if (diffX > 0) {
                    currentIndex = (currentIndex - 1 + keys.length) % keys.length;
                } else {
                    currentIndex = (currentIndex + 1) % keys.length;
                }
                
                loadFeed(keys[currentIndex]);
            }
        }

        // --- POMOCNICZE FUNKCJE DAT ---
        function getTimestamp(dateStr) {
            if (dateStr === null || dateStr === undefined) return 0;
            const s = String(dateStr).trim();
            if (!s) return 0;
            // Uniksowy znacznik czasu (sekundy lub milisekundy)
            if (/^\d{10,13}$/.test(s)) {
                const n = parseInt(s, 10);
                const ms = s.length === 10 ? n * 1000 : n;
                return isNaN(ms) ? 0 : ms;
            }
            // Amerykańskie MM/DD/YYYY (np. z niektórych RSS)
            if (s.includes('/')) {
                const match = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                if (match) {
                    const t = new Date(`${match[3]}-${String(match[1]).padStart(2, '0')}-${String(match[2]).padStart(2, '0')}`).getTime();
                    if (!isNaN(t)) return t;
                }
            }
            // Europejskie DD.MM.YYYY / DD-MM-YYYY [HH:mm[:ss]]
            let m = s.match(/(\d{1,2})[.\-](\d{1,2})[.\-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
            if (m) {
                const t = new Date(`${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}T${String(m[4] || '00').padStart(2, '0')}:${String(m[5] || '00').padStart(2, '0')}:${String(m[6] || '00').padStart(2, '0')}`).getTime();
                if (!isNaN(t)) return t;
            }
            const d = new Date(s);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        function parseFeedDate(dateStr) {
            if (dateStr === null || dateStr === undefined) return 'Brak daty';
            const s = String(dateStr).trim();
            if (!s) return 'Brak daty';
            if (getTimestamp(s) === 0) return 'Brak daty';
            const dateObj = new Date(getTimestamp(s));
            return formatDate(dateObj);
        }

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // --- USUWANIE DUPLIKATÓW (te same tytuły / linki) ---
        function normalizeTitle(t) {
            if (!t) return '';
            let s = String(t).replace(/<[^>]*>/g, ' ');
            s = s.replace(/&quot;|&laquo;|&raquo;|&#\d+;|&[a-z]+;/gi, ' ');
            s = s.toLowerCase();
            try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
            // Polskie znaki, które nie rozkładają się przez NFD (ł, itp.)
            s = s.replace(/ą/g, 'a').replace(/ć/g, 'c').replace(/ę/g, 'e').replace(/ł/g, 'l').replace(/ń/g, 'n').replace(/ó/g, 'o').replace(/ś/g, 's').replace(/ź/g, 'z').replace(/ż/g, 'z');
            s = s.replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
            return s;
        }

        function normalizeLink(l) {
            if (!l) return '';
            try {
                const u = new URL(String(l).trim());
                ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','igshid'].forEach(p => u.searchParams.delete(p));
                let s = (u.hostname.replace(/^www\./, '') + u.pathname).toLowerCase().replace(/\/+$/, '');
                const q = u.searchParams.toString();
                return q ? s + '?' + q : s;
            } catch (e) {
                return String(l).toLowerCase().split('#')[0].replace(/\/+$/, '').trim();
            }
        }

        function dedupeItems(items) {
            // Najpierw od najnowszych (przy duplikacie zostaje najnowsza wersja),
            // artykuły bez daty (timestamp 0) lądują na samym końcu.
            const withTs = [];
            const withoutTs = [];
            for (const it of items) {
                (getTimestamp(it.pubDate) > 0 ? withTs : withoutTs).push(it);
            }
            withTs.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));
            const sorted = withTs.concat(withoutTs);
            const seenTitles = new Set();
            const seenLinks = new Set();
            const out = [];
            for (const it of sorted) {
                // Porównuj po oryginale (przed tłumaczeniem), żeby PL i EN tej samej wiadomości się łapały
                const tk = normalizeTitle(it._orig !== undefined ? it._orig : it.title);
                const lk = normalizeLink(it.link);
                if (tk && seenTitles.has(tk)) continue;
                if (lk && seenLinks.has(lk)) continue;
                if (tk) seenTitles.add(tk);
                if (lk) seenLinks.add(lk);
                out.push(it);
            }
            return out;
        }

        // --- RENDEROWANIE ARTYKUŁÓW (NEVER ENDING SCROLLING, leniwe tłumaczenie) ---
        async function renderArticles(items, container, append = false, isCalendar = false) {
            if (!append) {
                container.innerHTML = '';
                displayedCount = 0;

                // Jeśli to zakładka kalendarz, wygeneruj widget jak kalendarzswiat.pl + dane na żywo z internetu
                if (isCalendar) {
                    const today = new Date();
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    const dateFormatted = today.toLocaleDateString('pl-PL', options);
                    const capitalizedDate = dateFormatted.charAt(0).toUpperCase() + dateFormatted.slice(1);

                    const dayOfYear = getDayOfYear(today);
                    const weekNum = getWeekNumber(today);
                    const stats = getYearStats(today);
                    const zodiac = getZodiacSign(today.getDate(), today.getMonth() + 1);
                    const moon = getMoonPhase(today);
                    const cytat = cytaty[dayOfYear % cytaty.length];

                    const widget = document.createElement('div');
                    widget.className = 'cal';
                    widget.innerHTML = `
                        <p class="cal-date">${capitalizedDate}</p>
                        <p class="cal-sub">${dayOfYear}. dzień roku &bull; Tydzień ${weekNum} &bull; ${stats.diffDays} dni do końca roku</p>
                        <div class="cal-grid">
                            <div class="cal-box">
                                <strong>Znak zodiaku:</strong> ${zodiac}<br>
                                🎂 <strong>Imieniny obchodzą:</strong> <span id="cal-imieniny">⏳ Pobieranie…</span>
                            </div>
                            <div class="cal-box">
                                <strong>Słońce i dzień:</strong><br>
                                <span id="cal-sun">⏳ Pobieranie…</span><br><br>
                                🌙 <strong>Faza Księżyca:</strong> ${moon.name} (${moon.illum}% jasności)
                            </div>
                        </div>
                        <div class="cal-box">
                            <strong>Najbliższe ważne daty (święta PL, na żywo):</strong>
                            <ul id="cal-najblizsze"><li>⏳ Pobieranie…</li></ul>
                        </div>
                        <div class="cal-quote">
                            <strong>Cytat dnia:</strong><br>
                            <em>${cytat.t}</em><br>
                            <small>— ${cytat.a}</small>
                        </div>
                    `;
                    container.appendChild(widget);
                    // Uzupełnij dane z internetu bez blokowania listy artykułów
                    fillCalendarWidget(today);
                }
            }

            const slice = items.slice(displayedCount, displayedCount + batchSize);
            if (slice.length === 0) return;

            // Najpierw render oryginału (natychmiast), potem podmiana na PL w tle
            const pending = [];
            slice.forEach(item => {
                const article = document.createElement('article');
                const pubDate = parseFeedDate(item.pubDate);
                const sourceName = item.sourceName || 'Wiadomości';

                let cleanDescription = (item.description || '').replace(/<[^>]*>/g, '').trim();

                article.innerHTML = `
                    <div class="article-meta" translate="no">${pubDate} &bull; ${sourceName}</div>
                    <h2 class="article-title">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer"></a>
                    </h2>
                    ${cleanDescription ? `<p class="article-description"></p>` : ''}
                `;
                article.querySelector('.article-title a').textContent = item.title || '';
                const descEl = article.querySelector('.article-description');
                if (descEl) descEl.textContent = cleanDescription;
                container.appendChild(article);

                // Tłumaczenie w tle bez blokowania listy
                if (!item._pl) {
                    pending.push((async () => {
                        await translateItem(item);
                        const a = article.querySelector('.article-title a');
                        if (a && document.contains(article)) a.textContent = item.title || '';
                        const d = article.querySelector('.article-description');
                        if (d && document.contains(article)) {
                            const clean = (item.description || '').replace(/<[^>]*>/g, '').trim();
                            d.textContent = clean;
                        }
                    })().catch(() => {}));
                }
            });

            displayedCount += slice.length;
        }

        // --- OBSŁUGA SCROLLOWANIA (NIESKOŃCZONE przewijanie) ---
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 400) {
                if (currentItems.length > 0 && displayedCount < currentItems.length) {
                    const feedContainer = document.getElementById('feed');
                    renderArticles(currentItems, feedContainer, true, currentSourceKey === 'kalendarz').catch(() => {});
                }
            }
        });

        // --- GŁÓWNA FUNKCJA POBIERANIA (surowe RSS + leniwe tłumaczenie + cache) ---
        async function loadFeed(sourceKey) {
            currentSourceKey = sourceKey;
            const loader = document.getElementById('loader');
            const feedContainer = document.getElementById('feed');

            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            hideNewPill();
            const activeTab = document.getElementById(`btn-${sourceKey}`);
            if (activeTab) {
                activeTab.classList.add('active');
                activeTab.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
            }

            // Kalendarz: sam widget, bez wiadomości i bez pobierania (ma być szybki)
            if (sourceKey === 'kalendarz') {
                loader.style.display = 'none';
                hideNewPill();
                currentItems = [];
                await renderArticles([], feedContainer, false, true);
                return;
            }

            // Jeśli dane są w pamięci podręcznej, otwórz natychmiast + dociągnij nowości na górę
            if (feedCache[sourceKey]) {
                loader.style.display = 'none';
                hideNewPill();
                currentItems = feedCache[sourceKey];
                await renderArticles(currentItems, feedContainer, false, sourceKey === 'kalendarz');
                // Świeże dane w tle: nowości lądują na górze listy, nie w cache na później
                fetchTabRaw(sourceKey).then(async fresh => {
                    if (!fresh || !fresh.length || sourceKey !== currentSourceKey) return;
                    const known = new Set(currentItems.map(it => normalizeLink(it.link)));
                    const news = fresh.filter(it => it.link && !known.has(normalizeLink(it.link)));
                    if (!news.length) {
                        // Nic nowego — tylko podmień cache na świeższy
                        feedCache[sourceKey] = fresh;
                        saveDiskCache(sourceKey, fresh);
                        return;
                    }
                    currentItems = dedupeItems(news.concat(currentItems));
                    feedCache[sourceKey] = currentItems;
                    saveDiskCache(sourceKey, currentItems);
                    if (window.scrollY < 200) {
                        // User na górze — od razu przerysuj z nowościami
                        await renderArticles(currentItems, feedContainer, false, sourceKey === 'kalendarz');
                    } else {
                        showNewPill(news.length);
                    }
                }).catch(() => {});
                return;
            }

            loader.style.display = 'block';
            feedContainer.innerHTML = '';
            displayedCount = 0;
            currentItems = [];
            let painted = false;

            // Malowanie progresywne: pierwszy feed maluje listę od razu,
            // kolejne dopisują się w miarę spływania (góra = przerys, dół = pigułka)
            const paint = (merged) => {
                if (sourceKey !== currentSourceKey || !merged.length) return;
                currentItems = merged;
                if (!painted) {
                    painted = true;
                    loader.style.display = 'none';
                    renderArticles(currentItems, feedContainer, false, false).catch(() => {});
                } else if (window.scrollY < 200) {
                    renderArticles(currentItems, feedContainer, false, false).catch(() => {});
                } else if (currentItems.length > displayedCount) {
                    showNewPill(currentItems.length - displayedCount);
                }
            };

            try {
                const combinedItems = await fetchTabRaw(sourceKey, paint);
                if (sourceKey !== currentSourceKey) return;

                loader.style.display = 'none';

                if (!combinedItems.length && !painted) {
                    feedContainer.innerHTML = '<p class="text-muted">Nie udało się wczytać żadnych artykułów. Spróbuj ponownie za chwilę (limit API).</p>';
                    return;
                }

                // Zapisz surowe (nieprzetłumaczone) artykuły — tłumaczenie dopiero przy renderze
                // Nie nadpisuj dobrego cache pustym wynikiem
                if (combinedItems.length) {
                    feedCache[sourceKey] = combinedItems;
                    saveDiskCache(sourceKey, combinedItems);
                }
                currentItems = combinedItems;
                if (!painted) {
                    await renderArticles(currentItems, feedContainer, false, false);
                } else if (window.scrollY < 200) {
                    hideNewPill();
                    await renderArticles(currentItems, feedContainer, false, false);
                } else if (currentItems.length > displayedCount) {
                    showNewPill(currentItems.length - displayedCount);
                } else {
                    hideNewPill();
                }

            } catch (error) {
                loader.style.display = 'none';
                if (painted) return;
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        <p><strong>Wystąpił nieoczekiwany problem:</strong> ${error.message}</p>
                    </div>`;
            }
        }

        // --- POBIERANIE W TLE DLA POZOSTAŁYCH ZAKŁADEK (dopiero gdy user już czyta, z dużym odstępem) ---
        async function prefetchOtherFeeds() {
            if (document.hidden) { setTimeout(prefetchOtherFeeds, 5000); return; }
            for (const key of Object.keys(feeds)) {
                if (key === currentSourceKey || key === 'kalendarz' || feedCache[key]) continue;
                try {
                    const items = await fetchTabRaw(key);
                    if (items.length > 0) {
                        feedCache[key] = items;
                        saveDiskCache(key, items);
                    }
                } catch (e) {}
                await sleep(2500);
            }
        }

        // Pigułka "Nowe artykuły" — pokazuje się, gdy świeże newsy doszły w tle podczas scrollowania
        function showNewPill(n) {
            const pill = document.getElementById('newPill');
            if (!pill) return;
            pill.textContent = n === 1 ? '↑ 1 nowy artykuł — pokaż' : `↑ ${n} nowych artykułów — pokaż`;
            pill.hidden = false;
            requestAnimationFrame(() => pill.classList.add('show'));
        }
        function hideNewPill() {
            const pill = document.getElementById('newPill');
            if (!pill) return;
            pill.classList.remove('show');
            pill.hidden = true;
        }
        document.getElementById('newPill')?.addEventListener('click', async () => {
            hideNewPill();
            const feedContainer = document.getElementById('feed');
            await renderArticles(currentItems, feedContainer, false, currentSourceKey === 'kalendarz');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function toggleTheme() {
            const r = document.documentElement, dark = r.dataset.theme !== 'dark';
            if (dark) r.dataset.theme = 'dark'; else delete r.dataset.theme;
            document.querySelector('meta[name=theme-color]').content = dark ? '#131A18' : '#EDF0EB';
        }
        if (matchMedia('(prefers-color-scheme: dark)').matches) toggleTheme();

        window.onload = () => {
            loadFeed('kalendarz');
            setTimeout(prefetchOtherFeeds, 6000);
        };
    </script>
</body>
