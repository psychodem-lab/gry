<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Wyścigi 2D</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0c1b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        #ui {
            margin-bottom: 15px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #a4b0be;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(84, 160, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #54a0ff;
        }
        canvas {
            display: block;
            background-color: #2f3640;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4757, #ff6b6b);
            color: white;
            border: none;
            border-radius: 30px;
            display: none;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 71, 87, 0.6);
            background: linear-gradient(45deg, #ff3838, #ff4757);
        }
        button:active {
            transform: translateY(1px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>TURBO WYŚCIGI</h1>
        <p>Sterowanie: Strzałki Lewo/Prawo lub klawisze A / D</p>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="450" height="650"></canvas>
    </div>
    <button id="restartBtn" onclick="resetGame()">Zagraj Ponownie</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');

        // Zmienne gry
        let frames = 0;
        let score = 0;
        let isGameOver = false;
        let gameSpeed = 4;
        let obstacles = [];
        let particles = [];
        let roadOffset = 0;

        // Obiekt gracza
        const player = {
            width: 44,
            height: 80,
            x: canvas.width / 2 - 22,
            y: canvas.height - 110,
            speed: 6,
            dx: 0
        };

        // Nasłuchiwanie klawiszy
        const keys = {};
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                player.dx = -player.speed;
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                player.dx = player.speed;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (
                e.code === 'ArrowLeft' || e.code === 'KeyA' ||
                e.code === 'ArrowRight' || e.code === 'KeyD'
            ) {
                player.dx = 0;
            }
        });

        // Kolory i warianty przeszkód
        const obstacleTypes = [
            { main: '#ff4757', accent: '#ff6b6b', roof: '#2f3542' }, // Czerwony sportowy
            { main: '#ffa502', accent: '#ff7f50', roof: '#2f3542' }, // Pomarańczowy
            { main: '#2ed573', accent: '#7bed9f', roof: '#2f3542' }, // Zielony
            { main: '#9b59b6', accent: '#8e44ad', roof: '#2f3542' }, // Fioletowy
            { main: '#eccc68', accent: '#ffa502', roof: '#2f3542' }  // Żółty taxi
        ];

        // Klasa przeszkody
        class Obstacle {
            constructor() {
                this.width = 44;
                this.height = 80;
                // Trzy pasy ruchu
                const lanes = [65, 168, 272, 340];
                // Lub losowa pozycja na jezdni (od 50 do canvas.width - 50 - width)
                this.x = 45 + Math.random() * (canvas.width - 90 - this.width);
                this.y = -this.height - 50;
                this.speed = gameSpeed * (0.7 + Math.random() * 0.3);
                this.colorScheme = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            }

            draw() {
                drawDetailedCar(this.x, this.y, this.width, this.height, this.colorScheme.main, this.colorScheme.accent, this.colorScheme.roof, false);
            }

            update() {
                this.y += gameSpeed;
                this.draw();
            }
        }

        // Rysowanie szczegółowego samochodu
        function drawDetailedCar(x, y, w, h, mainColor, accentColor, roofColor, isPlayer) {
            ctx.save();
            
            // Cień auta
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;

            // Koła
            ctx.fillStyle = '#1e272e';
            // Lewe przednie
            ctx.fillRect(x - 5, y + 12, 6, 16);
            // Prawe przednie
            ctx.fillRect(x + w - 1, y + 12, 6, 16);
            // Lewe tylne
            ctx.fillRect(x - 5, y + h - 24, 6, 16);
            // Prawe tylne
            ctx.fillRect(x + w - 1, y + h - 24, 6, 16);

            // Główne nadwozie (karoseria)
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, [12, 12, 8, 8]);
            ctx.fillStyle = mainColor;
            ctx.fill();

            // Refleksy / gradient na karoserii
            let grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Dach / kabina
            ctx.beginPath();
            ctx.roundRect(x + 5, y + 22, w - 10, h - 42, [6, 6, 4, 4]);
            ctx.fillStyle = roofColor;
            ctx.fill();

            // Przednia szyba
            ctx.fillStyle = '#1e272e';
            ctx.beginPath();
            ctx.roundRect(x + 7, y + 24, w - 14, 16, [4, 4, 1, 1]);
            ctx.fill();

            // Tylna szyba
            ctx.beginPath();
            ctx.roundRect(x + 7, y + h - 36, w - 14, 12, [1, 1, 4, 4]);
            ctx.fill();

            // Reflektory przednie (dla auta i przeszkód)
            ctx.fillStyle = isPlayer ? '#70a1ff' : '#fff200';
            ctx.shadowColor = isPlayer ? '#1e90ff' : '#fffa65';
            ctx.shadowBlur = 8;
            ctx.fillRect(x + 4, y + 2, 8, 4);
            ctx.fillRect(x + w - 12, y + 2, 8, 4);

            // Światła tylne
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 6;
            ctx.fillRect(x + 4, y + h - 4, 8, 3);
            ctx.fillRect(x + w - 12, y + h - 4, 8, 3);

            ctx.restore();
        }

        // Rysowanie gracza
        function drawPlayer() {
            drawDetailedCar(player.x, player.y, player.width, player.height, '#00d2d3', '#54a0ff', '#2f3542', true);
        }

        // Efekt cząsteczek dymu/iskier spalin
        function addParticle() {
            if (frames % 2 === 0) {
                particles.push({
                    x: player.x + player.width / 2 + (Math.random() - 0.5) * 20,
                    y: player.y + player.height,
                    size: 2 + Math.random() * 4,
                    color: Math.random() > 0.5 ? 'rgba(255,255,255,0.6)' : 'rgba(200,200,200,0.4)',
                    vy: 2 + Math.random() * 2
                });
            }
        }

        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += p.vy + gameSpeed * 0.5;
                p.size *= 0.95;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.size < 0.5) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }

        // Tworzenie i aktualizacja przeszkód
        function handleObstacles() {
            if (frames % 80 === 0) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    
                    if (score % 5 === 0) {
                        gameSpeed += 0.4;
                    }
                    i--;
                    continue;
                }

                // Kolizja z dokładniejszym marginesem
                let margin = 4;
                if (
                    player.x + margin < obstacles[i].x + obstacles[i].width - margin &&
                    player.x + player.width - margin > obstacles[i].x + margin &&
                    player.y + margin < obstacles[i].y + obstacles[i].height - margin &&
                    player.y + player.height - margin > obstacles[i].y + margin
                ) {
                    isGameOver = true;
                }
            }
        }

        // Tło i pasy na drodze z pejzażem pobocza
        function drawRoad() {
            // Trawa / pobocze
            ctx.fillStyle = '#1e3799';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Asfalt jezdni
            ctx.fillStyle = '#353b48';
            ctx.fillRect(35, 0, canvas.width - 70, canvas.height);

            // Krawędzie jezdni (białe linie)
            ctx.fillStyle = '#f5f6fa';
            ctx.fillRect(35, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 41, 0, 6, canvas.height);

            // Pobocze wzór (krawężnik czerwono-biały lub pasy trawy)
            ctx.fillStyle = '#222f3e';
            ctx.fillRect(0, 0, 35, canvas.height);
            ctx.fillRect(canvas.width - 35, 0, 35, canvas.height);

            // Pasy rozdzielające (przerywane, animowane)
            roadOffset = (roadOffset + gameSpeed) % 80;
            ctx.fillStyle = '#fbc531';
            for (let i = -80; i < canvas.height + 80; i += 80) {
                ctx.fillRect(canvas.width / 2 - 4, i + roadOffset, 8, 40);
            }
        }

        // Wyświetlanie wyniku
        function drawScore() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.roundRect(10, 10, 150, 45, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Segoe UI", Arial';
            ctx.fillText(`Wynik: ${score}`, 25, 38);
            ctx.restore();
        }

        // Resetowanie gry
        function resetGame() {
            isGameOver = false;
            score = 0;
            frames = 0;
            gameSpeed = 4;
            obstacles = [];
            particles = [];
            player.x = canvas.width / 2 - player.width / 2;
            restartBtn.style.display = 'none';
            gameLoop();
        }

        // Główna pętla gry
        function gameLoop() {
            if (isGameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(15, 12, 27, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4757';
                ctx.font = 'bold 38px "Segoe UI", Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 71, 87, 0.5)';
                ctx.shadowBlur = 15;
                ctx.fillText('KONIEC GRY', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#ffffff';
                ctx.font = '22px "Segoe UI", Arial';
                ctx.shadowBlur = 0;
                ctx.fillText(`Twój wynik: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                
                ctx.textAlign = 'left';
                ctx.restore();

                restartBtn.style.display = 'inline-block';
                return;
            }

            // Czyszczenie płótna
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            // Aktualizacja pozycji gracza z płynnym ruchem
            player.x += player.dx;

            // Ograniczenia krawędzi jezdni
            if (player.x < 42) player.x = 42;
            if (player.x + player.width > canvas.width - 42) player.x = canvas.width - 42 - player.width;

            addParticle();
            updateParticles();
            drawPlayer();
            handleObstacles();
            drawScore();

            frames++;
            requestAnimationFrame(gameLoop);
        }

        // Uruchomienie gry
        gameLoop();
    </script>
</body>
</html>
