<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra Wyścigowa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            background-color: #34495e;
            border: 5px solid #ecf0f1;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui {
            margin-bottom: 10px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            display: none; /* Ukryty na start */
            margin-top: 10px;
        }
        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Omijaj auta!</h1>
        <p>Sterowanie: Strzałki Lewo/Prawo lub A/D</p>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <button id="restartBtn" onclick="resetGame()">Zagraj ponownie</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');

        // Zmienne gry
        let frames = 0;
        let score = 0;
        let isGameOver = false;
        let gameSpeed = 3;
        let obstacles = [];

        // Obiekt gracza
        const player = {
            width: 40,
            height: 70,
            x: canvas.width / 2 - 20,
            y: canvas.height - 90,
            speed: 5,
            dx: 0
        };

        // Nasłuchiwanie klawiszy
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                player.dx = -player.speed;
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                player.dx = player.speed;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (
                e.code === 'ArrowLeft' || e.code === 'KeyA' ||
                e.code === 'ArrowRight' || e.code === 'KeyD'
            ) {
                player.dx = 0;
            }
        });

        // Klasa przeszkody
        class Obstacle {
            constructor() {
                this.width = 40;
                this.height = 70;
                // Losowa pozycja X na drodze
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
            }

            draw() {
                ctx.fillStyle = '#e74c3c'; // Czerwone auta/przeszkody
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Detale "auta"
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(this.x + 5, this.y + 10, this.width - 10, this.height - 20);
            }

            update() {
                this.y += gameSpeed;
                this.draw();
            }
        }

        // Rysowanie gracza
        function drawPlayer() {
            ctx.fillStyle = '#3498db'; // Niebieskie auto gracza
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Detale (szyby itp.)
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(player.x + 5, player.y + 15, player.width - 10, player.height - 30);
        }

        // Tworzenie i aktualizacja przeszkód
        function handleObstacles() {
            // Dodawanie nowych przeszkód co 90 klatek
            if (frames % 90 === 0) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();

                // Usuwanie przeszkód, które wypadły poza ekran i dodawanie punktów
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    
                    // Zwiększanie poziomu trudności (szybkości) co 5 punktów
                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                    }
                    i--;
                    continue;
                }

                // Wykrywanie kolizji
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    isGameOver = true;
                }
            }
        }

        // Tło i pasy na jezdni
        function drawRoad() {
            ctx.fillStyle = '#fff';
            // Linia środkowa przerywana (animowana za pomocą przesunięcia zależnego od klatek)
            for (let i = -100; i < canvas.height; i += 80) {
                ctx.fillRect(canvas.width / 2 - 2, i + (frames * gameSpeed) % 80, 4, 40);
            }
        }

        // Wyświetlanie wyniku
        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText(`Wynik: ${score}`, 10, 30);
        }

        // Resetowanie gry
        function resetGame() {
            isGameOver = false;
            score = 0;
            frames = 0;
            gameSpeed = 3;
            obstacles = [];
            player.x = canvas.width / 2 - player.width / 2;
            restartBtn.style.display = 'none';
            gameLoop();
        }

        // Główna pętla gry
        function gameLoop() {
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('KONIEC GRY', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText(`Twój wynik: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
                restartBtn.style.display = 'inline-block';
                return;
            }

            // Czyszczenie płótna
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            // Aktualizacja pozycji gracza
            player.x += player.dx;

            // Ograniczenia krawędzi (żeby nie wyjechać poza ekran)
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            drawPlayer();
            handleObstacles();
            drawScore();

            frames++;
            requestAnimationFrame(gameLoop);
        }

        // Uruchomienie gry
        gameLoop();
    </script>
</body>
</html>
