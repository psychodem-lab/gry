<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Wyścigi 2D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0c1b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        #ui {
            text-align: center;
            margin-bottom: 5px;
            flex-shrink: 0;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: clamp(20px, 5vw, 28px);
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }
        p {
            margin: 0;
            font-size: clamp(11px, 3.2vw, 14px);
            color: #a4b0be;
        }
        .game-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
            max-height: calc(100vh - 160px);
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(84, 160, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #54a0ff;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 450 / 650;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #2f3640;
            touch-action: none;
        }
        .restart-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #restartBtn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4757, #ff6b6b);
            color: white;
            border: none;
            border-radius: 30px;
            display: none;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }
        #restartBtn:active {
            transform: scale(0.96);
        }
        /* Kontrolki dotykowe na telefony */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            padding: 10px 15px 10px 15px;
            flex-shrink: 0;
            touch-action: none;
        }
        .touch-btn {
            flex: 1;
            height: 60px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.1s, transform 0.1s, border-color 0.1s, box-shadow 0.1s;
            touch-action: none;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(84, 160, 255, 0.4);
            border-color: #54a0ff;
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(84, 160, 255, 0.6);
        }
        .touch-btn span {
            pointer-events: none;
        }
        .touch-hint {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #747d8c;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>TURBO WYŚCIGI</h1>
        <p id="instructionText">Steruj przyciskami na dole, dotknij ekranu lub użyj strzałek / A D</p>
    </div>

    <div class="game-wrapper">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="450" height="650"></canvas>
            <div class="restart-overlay">
                <button id="restartBtn" onclick="resetGame()">ZAGRAJ PONOWNIE</button>
            </div>
        </div>
    </div>

    <!-- Przyciski mobilne -->
    <div class="mobile-controls" id="mobileControls">
        <button class="touch-btn" id="btnLeft" aria-label="W lewo">
            <span>◀</span>
        </button>
        <button class="touch-btn" id="btnRight" aria-label="W prawo">
            <span>▶</span>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const canvasContainer = document.getElementById('canvasContainer');

        // Zmienne gry
        let frames = 0;
        let score = 0;
        let isGameOver = false;
        let gameSpeed = 4;
        let obstacles = [];
        let particles = [];
        let roadOffset = 0;

        // Sterowanie
        let moveLeft = false;
        let moveRight = false;
        let touchTargetX = null;

        // Obiekt gracza
        const player = {
            width: 44,
            height: 80,
            x: canvas.width / 2 - 22,
            y: canvas.height - 110,
            speed: 6.5
        };

        // Klawiatura
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                moveLeft = true;
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                moveRight = true;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                moveLeft = false;
            } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                moveRight = false;
            }
        });

        // Obsługa wibracji (haptic feedback)
        function triggerHaptic(duration = 20) {
            if (navigator.vibrate) {
                try {
                    navigator.vibrate(duration);
                } catch (e) {}
            }
        }

        // Dotykowe przyciski ekranowe (Touch Events)
        function setupButtonTouch(btn, isLeft) {
            const startHandler = (e) => {
                e.preventDefault();
                if (isLeft) moveLeft = true;
                else moveRight = true;
                btn.classList.add('active');
                triggerHaptic(10);
            };

            const endHandler = (e) => {
                e.preventDefault();
                if (isLeft) moveLeft = false;
                else moveRight = false;
                btn.classList.remove('active');
            };

            btn.addEventListener('touchstart', startHandler, { passive: false });
            btn.addEventListener('touchend', endHandler, { passive: false });
            btn.addEventListener('touchcancel', endHandler, { passive: false });
            btn.addEventListener('mousedown', startHandler);
            btn.addEventListener('mouseup', endHandler);
            btn.addEventListener('mouseleave', endHandler);
        }

        setupButtonTouch(btnLeft, true);
        setupButtonTouch(btnRight, false);

        // Bezpośrednie sterowanie dotykiem / przeciąganiem na planszy (Canvas touch/drag)
        function getCanvasTouchX(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const scaleX = canvas.width / rect.width;
            return (clientX - rect.left) * scaleX;
        }

        function handleTouchCanvas(e) {
            if (isGameOver) return;
            e.preventDefault();
            const touchX = getCanvasTouchX(e);
            touchTargetX = touchX;
        }

        canvas.addEventListener('touchstart', handleTouchCanvas, { passive: false });
        canvas.addEventListener('touchmove', handleTouchCanvas, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchTargetX = null;
        }, { passive: false });
        canvas.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            touchTargetX = null;
        }, { passive: false });

        // Kolory i warianty przeszkód
        const obstacleTypes = [
            { main: '#ff4757', accent: '#ff6b6b', roof: '#2f3542' },
            { main: '#ffa502', accent: '#ff7f50', roof: '#2f3542' },
            { main: '#2ed573', accent: '#7bed9f', roof: '#2f3542' },
            { main: '#9b59b6', accent: '#8e44ad', roof: '#2f3542' },
            { main: '#eccc68', accent: '#ffa502', roof: '#2f3542' }
        ];

        class Obstacle {
            constructor() {
                this.width = 44;
                this.height = 80;
                this.x = 45 + Math.random() * (canvas.width - 90 - this.width);
                this.y = -this.height - 50;
                this.speed = gameSpeed * (0.7 + Math.random() * 0.3);
                this.colorScheme = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
            }

            draw() {
                drawDetailedCar(this.x, this.y, this.width, this.height, this.colorScheme.main, this.colorScheme.accent, this.colorScheme.roof, false);
            }

            update() {
                this.y += gameSpeed;
                this.draw();
            }
        }

        // Rysowanie szczegółowego samochodu
        function drawDetailedCar(x, y, w, h, mainColor, accentColor, roofColor, isPlayer) {
            ctx.save();
            
            // Cień auta
            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            // Koła
            ctx.fillStyle = '#1e272e';
            ctx.fillRect(x - 4, y + 12, 6, 16);
            ctx.fillRect(x + w - 2, y + 12, 6, 16);
            ctx.fillRect(x - 4, y + h - 24, 6, 16);
            ctx.fillRect(x + w - 2, y + h - 24, 6, 16);

            // Główne nadwozie
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, [12, 12, 8, 8]);
            ctx.fillStyle = mainColor;
            ctx.fill();

            // Refleksy / gradient
            let grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.25)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Dach / kabina
            ctx.beginPath();
            ctx.roundRect(x + 5, y + 22, w - 10, h - 42, [6, 6, 4, 4]);
            ctx.fillStyle = roofColor;
            ctx.fill();

            // Przednia szyba
            ctx.fillStyle = '#1e272e';
            ctx.beginPath();
            ctx.roundRect(x + 7, y + 24, w - 14, 16, [4, 4, 1, 1]);
            ctx.fill();

            // Tylna szyba
            ctx.beginPath();
            ctx.roundRect(x + 7, y + h - 36, w - 14, 12, [1, 1, 4, 4]);
            ctx.fill();

            // Reflektory przednie
            ctx.fillStyle = isPlayer ? '#70a1ff' : '#fff200';
            ctx.shadowColor = isPlayer ? '#1e90ff' : '#fffa65';
            ctx.shadowBlur = 8;
            ctx.fillRect(x + 4, y + 2, 8, 4);
            ctx.fillRect(x + w - 12, y + 2, 8, 4);

            // Światła tylne
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 6;
            ctx.fillRect(x + 4, y + h - 4, 8, 3);
            ctx.fillRect(x + w - 12, y + h - 4, 8, 3);

            ctx.restore();
        }

        // Rysowanie gracza
        function drawPlayer() {
            drawDetailedCar(player.x, player.y, player.width, player.height, '#00d2d3', '#54a0ff', '#2f3542', true);
        }

        // Cząsteczki spalin
        function addParticle() {
            if (frames % 2 === 0) {
                particles.push({
                    x: player.x + player.width / 2 + (Math.random() - 0.5) * 16,
                    y: player.y + player.height,
                    size: 2 + Math.random() * 4,
                    color: Math.random() > 0.5 ? 'rgba(255,255,255,0.6)' : 'rgba(200,200,200,0.4)',
                    vy: 2 + Math.random() * 2
                });
            }
        }

        function updateParticles() {
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += p.vy + gameSpeed * 0.5;
                p.size *= 0.95;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.size < 0.5) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }

        // Aktualizacja przeszkód
        function handleObstacles() {
            if (frames % 75 === 0) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    
                    if (score % 5 === 0) {
                        gameSpeed += 0.4;
                    }
                    i--;
                    continue;
                }

                // Kolizja
                let margin = 5;
                if (
                    player.x + margin < obstacles[i].x + obstacles[i].width - margin &&
                    player.x + player.width - margin > obstacles[i].x + margin &&
                    player.y + margin < obstacles[i].y + obstacles[i].height - margin &&
                    player.y + player.height - margin > obstacles[i].y + margin
                ) {
                    isGameOver = true;
                    triggerHaptic(100);
                }
            }
        }

        // Tło i pasy drogi
        function drawRoad() {
            // Trawa / pobocze
            ctx.fillStyle = '#1e3799';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Asfalt
            ctx.fillStyle = '#353b48';
            ctx.fillRect(35, 0, canvas.width - 70, canvas.height);

            // Białe linie krawędzi
            ctx.fillStyle = '#f5f6fa';
            ctx.fillRect(35, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 41, 0, 6, canvas.height);

            // Krawężnik pobocza
            ctx.fillStyle = '#222f3e';
            ctx.fillRect(0, 0, 35, canvas.height);
            ctx.fillRect(canvas.width - 35, 0, 35, canvas.height);

            // Pasy środkowe
            roadOffset = (roadOffset + gameSpeed) % 80;
            ctx.fillStyle = '#fbc531';
            for (let i = -80; i < canvas.height + 80; i += 80) {
                ctx.fillRect(canvas.width / 2 - 4, i + roadOffset, 8, 40);
            }
        }

        // Wyświetlanie wyniku
        function drawScore() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath();
            ctx.roundRect(10, 10, 140, 42, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Segoe UI", Arial';
            ctx.fillText(`Wynik: ${score}`, 22, 37);
            ctx.restore();
        }

        // Resetowanie gry
        function resetGame() {
            isGameOver = false;
            score = 0;
            frames = 0;
            gameSpeed = 4;
            obstacles = [];
            particles = [];
            moveLeft = false;
            moveRight = false;
            touchTargetX = null;
            player.x = canvas.width / 2 - player.width / 2;
            restartBtn.style.display = 'none';
            gameLoop();
        }

        // Główna pętla gry
        function gameLoop() {
            if (isGameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(15, 12, 27, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4757';
                ctx.font = 'bold 36px "Segoe UI", Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 71, 87, 0.5)';
                ctx.shadowBlur = 15;
                ctx.fillText('KONIEC GRY', canvas.width / 2, canvas.height / 2 - 25);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px "Segoe UI", Arial';
                ctx.shadowBlur = 0;
                ctx.fillText(`Twój wynik: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.textAlign = 'left';
                ctx.restore();

                restartBtn.style.display = 'inline-block';
                return;
            }

            // Czyszczenie
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRoad();

            // Sterowanie bezpośrednim dotykiem (płynne podążanie za palcem)
            if (touchTargetX !== null) {
                const targetCarCenter = touchTargetX - player.width / 2;
                const diff = targetCarCenter - player.x;
                if (Math.abs(diff) > 2) {
                    player.x += Math.sign(diff) * Math.min(Math.abs(diff), player.speed * 1.2);
                }
            } else {
                // Sterowanie przyciskami / klawiaturą
                if (moveLeft) player.x -= player.speed;
                if (moveRight) player.x += player.speed;
            }

            // Ograniczenia krawędzi jezdni
            if (player.x < 42) player.x = 42;
            if (player.x + player.width > canvas.width - 42) player.x = canvas.width - 42 - player.width;

            addParticle();
            updateParticles();
            drawPlayer();
            handleObstacles();
            drawScore();

            frames++;
            requestAnimationFrame(gameLoop);
        }

        // Start
        gameLoop();
    </script>
</body>
</html>
