<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wirtualny Stworek – Ewolucja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #e0c3fc;
      --bg-bottom: #8ec5fc;
      --card-bg: rgba(255, 255, 255, 0.45);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-color: #4a4e69;
      --btn-shadow: 0 8px 20px rgba(100, 110, 140, 0.15);
      --font-family: 'Nunito', sans-serif;
    }

    /* Pory Dnia */
    body.time-morning {
      --bg-top: #ffecd2;
      --bg-bottom: #fcb69f;
      --text-color: #5d4037;
    }
    body.time-day {
      --bg-top: #a1c4fd;
      --bg-bottom: #c2e9fb;
      --text-color: #2c3e50;
    }
    body.time-sunset {
      --bg-top: #f3a683;
      --bg-bottom: #f7d794;
      --text-color: #4a235a;
    }
    body.time-night {
      --bg-top: #0f172a;
      --bg-bottom: #1e1b4b;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-color: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-family);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      transition: background 1.5s ease;
      color: var(--text-color);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100dvh;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px) 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Górna belka */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--btn-shadow);
      z-index: 10;
    }

    .pet-info {
      display: flex;
      flex-direction: column;
    }

    .pet-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pet-name {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .evo-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.35);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .evo-timer {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .top-controls {
      display: flex;
      gap: 8px;
    }

    .top-controls button {
      background: rgba(255, 255, 255, 0.35);
      border: none;
      font-size: 1.2rem;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-color);
      transition: transform 0.2s ease;
    }

    .top-controls button:active {
      transform: scale(0.9);
    }

    /* Obszar gry / Canvas */
    .game-viewport {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-height: 380px;
      touch-action: none;
    }

    /* Paski potrzeb */
    .stats-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      box-shadow: var(--btn-shadow);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .stat-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      width: 80%;
      border-radius: 10px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fill-hunger { background: linear-gradient(90deg, #ff9a9e, #fecfef); }
    .fill-energy { background: linear-gradient(90deg, #a1c4fd, #c2e9fb); }
    .fill-happiness { background: linear-gradient(90deg, #fbc2eb, #a6c1ee); }
    .fill-clean { background: linear-gradient(90deg, #84fab0, #8fd3f4); }

    /* Panel Akcji */
    .actions-deck {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 12px;
    }

    .action-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: transform 0.15s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.6);
    }

    .action-btn .icon { font-size: 1.6rem; }
    .action-btn .label { font-size: 0.8rem; font-weight: 700; color: var(--text-color); }

    /* MODAL WYBORU POSTACI */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      color: #2c3e50;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .char-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .char-option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f0f4f8;
      border: 2px solid transparent;
      padding: 12px 16px;
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .char-option-btn:hover, .char-option-btn:active {
      background: #e2e8f0;
      border-color: #8ec5fc;
      transform: translateY(-2px);
    }

    .char-icon {
      font-size: 2.2rem;
    }

    .char-details h4 {
      font-size: 1rem;
      font-weight: 800;
    }

    .char-details p {
      font-size: 0.75rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <!-- Ekran wyboru postaci -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-card">
      <h2 class="modal-title">Wybierz swojego Stworka</h2>
      <p class="modal-subtitle">Każdy stworek ewoluuje inaczej wraz z upływem czasu opieki!</p>
      
      <div class="char-options">
        <button class="char-option-btn" onclick="selectCharacter('lumi')">
          <span class="char-icon">🌸</span>
          <div class="char-details">
            <h4>Lumi</h4>
            <p>Puszek 🌱 ➔ Młodziak 🌿 ➔ Dorosły 🌸 ➔ Mistyczny 👑</p>
          </div>
        </button>

        <button class="char-option-btn" onclick="selectCharacter('spinacz')">
          <span class="char-icon">📎</span>
          <div class="char-details">
            <h4>Spinacz</h4>
            <p>Srebrny 📎 ➔ Czarny 🖤 ➔ Złoty 🌟 ➔ Złoty Król 👑</p>
          </div>
        </button>

        <button class="char-option-btn" onclick="selectCharacter('kotek')">
          <span class="char-icon">🐱</span>
          <div class="char-details">
            <h4>Kotek</h4>
            <p>Kotek 🐱 ➔ Żbik 🐾 ➔ Tygrys 🐯 ➔ Wielki Tygrys 👑</p>
          </div>
        </button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- Górny panel -->
    <header class="header">
      <div class="pet-info">
        <div class="pet-name-row">
          <span class="pet-name" id="pet-name">Lumi</span>
          <span class="evo-badge" id="evo-badge">Maluch 🌱</span>
        </div>
        <span class="evo-timer" id="evo-timer">Następna ewolucja: 05:00</span>
      </div>
      <div class="top-controls">
        <button id="char-select-btn" title="Zmień stworka">🐾</button>
        <button id="weather-toggle-btn" title="Zmień pogodę">☀️</button>
      </div>
    </header>

    <!-- Obszar gry / Canvas -->
    <main class="game-viewport">
      <canvas id="petCanvas"></canvas>
    </main>

    <!-- Wskaźniki statystyk -->
    <section class="stats-card">
      <div class="stat-item">
        <div class="stat-label"><span>Najedzenie</span><span id="val-hunger">80%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill fill-hunger" id="bar-hunger"></div></div>
      </div>
      <div class="stat-item">
        <div class="stat-label"><span>Energia</span><span id="val-energy">90%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill fill-energy" id="bar-energy"></div></div>
      </div>
      <div class="stat-item">
        <div class="stat-label"><span>Szczęście</span><span id="val-happiness">85%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill fill-happiness" id="bar-happiness"></div></div>
      </div>
      <div class="stat-item">
        <div class="stat-label"><span>Czystość</span><span id="val-clean">95%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill fill-clean" id="bar-clean"></div></div>
      </div>
    </section>

    <!-- Dół: Przyciski akcji -->
    <nav class="actions-deck">
      <button class="action-btn" id="btn-feed">
        <span class="icon">🍎</span>
        <span class="label">Karm</span>
      </button>
      <button class="action-btn" id="btn-sleep">
        <span class="icon">🌙</span>
        <span class="label" id="label-sleep">Sen</span>
      </button>
      <button class="action-btn" id="btn-clean">
        <span class="icon">✨</span>
        <span class="label">Czyść</span>
      </button>
    </nav>
  </div>

  <script>
    /* --- CONFIG EWOLUCJI I POSTACI --- */
    const CHARACTERS = {
      lumi: {
        name: 'Lumi',
        stages: [
          { name: 'Maluch 🌱', radius: 50 },
          { name: 'Młodziak 🌿', radius: 62 },
          { name: 'Dorosły 🌸', radius: 72 },
          { name: 'Mistyczny 👑', radius: 82 }
        ]
      },
      spinacz: {
        name: 'Spinacz',
        stages: [
          { name: 'Srebrny 📎', radius: 50 },
          { name: 'Czarny 🖤', radius: 60 },
          { name: 'Złoty 🌟', radius: 70 },
          { name: 'Złoty Król 👑', radius: 80 }
        ]
      },
      kotek: {
        name: 'Kotek',
        stages: [
          { name: 'Kotek 🐱', radius: 50 },
          { name: 'Żbik 🐾', radius: 62 },
          { name: 'Tygrys 🐯', radius: 74 },
          { name: 'Wielki Tygrys 👑', radius: 85 }
        ]
      }
    };

    /* --- STAN GRY --- */
    const defaultState = {
      character: 'lumi',
      hunger: 85,
      energy: 90,
      happiness: 80,
      cleanliness: 95,
      isSleeping: false,
      careTimeSeconds: 0,
      lastUpdate: Date.now()
    };

    let gameState = { ...defaultState };
    let timeOfDay = 'day';
    let weatherState = 'clear';

    function loadGame() {
      const saved = localStorage.getItem('lumi_pet_save_v4');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          const now = Date.now();
          const elapsedMinutes = (now - parsed.lastUpdate) / (1000 * 60);

          gameState.character = parsed.character || 'lumi';
          gameState.hunger = Math.max(20, parsed.hunger - elapsedMinutes * 0.15);
          gameState.energy = parsed.isSleeping 
            ? Math.min(100, parsed.energy + elapsedMinutes * 0.4) 
            : Math.max(20, parsed.energy - elapsedMinutes * 0.1);
          gameState.happiness = Math.max(20, parsed.happiness - elapsedMinutes * 0.12);
          gameState.cleanliness = Math.max(20, parsed.cleanliness - elapsedMinutes * 0.08);
          gameState.isSleeping = parsed.isSleeping;
          gameState.careTimeSeconds = parsed.careTimeSeconds || 0;
          gameState.lastUpdate = now;
        } catch(e) {
          gameState = { ...defaultState };
        }
      } else {
        openCharModal();
      }
    }

    function saveGame() {
      gameState.lastUpdate = Date.now();
      localStorage.setItem('lumi_pet_save_v4', JSON.stringify(gameState));
    }

    /* --- REGULA EWOLUCJI (5 min = 300s, 10 min = 600s, 15 min = 900s) --- */
    function getEvolutionStage(sec) {
      if (sec < 300) return { stage: 0, nextAt: 300 };
      if (sec < 600) return { stage: 1, nextAt: 600 };
      if (sec < 900) return { stage: 2, nextAt: 900 };
      return { stage: 3, nextAt: null };
    }

    let previousStage = -1;

    function checkEvolution() {
      const evo = getEvolutionStage(gameState.careTimeSeconds);
      const charInfo = CHARACTERS[gameState.character] || CHARACTERS.lumi;
      const stageData = charInfo.stages[evo.stage];

      if (previousStage !== -1 && previousStage !== evo.stage) {
        spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '⭐', 20);
        spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '✨', 20);
      }
      previousStage = evo.stage;

      document.getElementById('pet-name').textContent = charInfo.name;
      document.getElementById('evo-badge').textContent = stageData.name;

      const timerElem = document.getElementById('evo-timer');
      if (evo.nextAt) {
        const remaining = evo.nextAt - gameState.careTimeSeconds;
        const mins = Math.floor(remaining / 60);
        const secs = Math.floor(remaining % 60);
        const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        timerElem.textContent = `Następna ewolucja: ${formatted}`;
      } else {
        timerElem.textContent = 'Maksymalny poziom ewolucji!';
      }
    }

    function selectCharacter(charKey) {
      gameState.character = charKey;
      closeCharModal();
      checkEvolution();
      saveGame();
      spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '✨', 15);
    }

    function openCharModal() { document.getElementById('charModal').classList.add('active'); }
    function closeCharModal() { document.getElementById('charModal').classList.remove('active'); }

    /* --- PORA DNIA (ZEGAR URZĄDZENIA) --- */
    function checkTimeOfDay() {
      const hour = new Date().getHours();
      if (hour >= 6 && hour < 12) timeOfDay = 'morning';
      else if (hour >= 12 && hour < 18) timeOfDay = 'day';
      else if (hour >= 18 && hour < 21) timeOfDay = 'sunset';
      else timeOfDay = 'night';

      document.body.className = `time-${timeOfDay}`;
    }

    /* --- CANVAS & ANIMACJE --- */
    const canvas = document.getElementById('petCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let rainDrops = [];
    let clouds = [];
    let stars = [];
    let petScaleY = 1;
    let breathProgress = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      initWeatherElements();
    }
    window.addEventListener('resize', resizeCanvas);

    function initWeatherElements() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;

      rainDrops = [];
      for (let i = 0; i < 45; i++) {
        rainDrops.push({
          x: Math.random() * w,
          y: Math.random() * h,
          length: 10 + Math.random() * 15,
          speed: 4 + Math.random() * 6,
          opacity: 0.3 + Math.random() * 0.4
        });
      }

      clouds = [
        { x: w * 0.1, y: 30, scale: 0.8, speed: 0.15 },
        { x: w * 0.6, y: 50, scale: 1.1, speed: 0.1 }
      ];

      stars = [];
      for (let i = 0; i < 30; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * (h * 0.7),
          size: 1 + Math.random() * 2,
          alpha: Math.random(),
          speed: 0.02 + Math.random() * 0.02
        });
      }
    }

    function spawnParticles(x, y, symbol, count = 6) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 40,
          y: y + (Math.random() - 0.5) * 40,
          vx: (Math.random() - 0.5) * 2,
          vy: -1.5 - Math.random() * 2,
          alpha: 1,
          size: 16 + Math.random() * 8,
          symbol: symbol
        });
      }
    }

    /* RYSOWANIE POGODY */
    function drawEnvironment(w, h) {
      if (timeOfDay === 'night') {
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
          s.alpha += s.speed;
          const a = (Math.sin(s.alpha) + 1) / 2;
          ctx.globalAlpha = a * 0.8;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      if (weatherState === 'cloudy' || weatherState === 'rain') {
        ctx.fillStyle = timeOfDay === 'night' ? 'rgba(255, 255, 255, 0.12)' : 'rgba(255, 255, 255, 0.45)';
        clouds.forEach(c => {
          c.x += c.speed;
          if (c.x > w + 60) c.x = -60;

          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.scale(c.scale, c.scale);
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.arc(16, -8, 22, 0, Math.PI * 2);
          ctx.arc(36, 0, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }

      if (weatherState === 'rain') {
        ctx.strokeStyle = timeOfDay === 'night' ? 'rgba(180, 210, 255, 0.5)' : 'rgba(120, 160, 220, 0.6)';
        ctx.lineWidth = 1.5;
        rainDrops.forEach(d => {
          d.y += d.speed;
          d.x += 0.5;
          if (d.y > h) {
            d.y = -d.length;
            d.x = Math.random() * w;
          }

          ctx.globalAlpha = d.opacity;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + 2, d.y + d.length);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }
    }

    /* --- FUNKCJE RYSOWANIA DLA POSZCZEGÓLNYCH POSTACI --- */

    // KORONA DLA EWOLUCJI
    function drawCrown(ctx, radius) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(-15, -radius - 2);
      ctx.lineTo(-20, -radius - 22);
      ctx.lineTo(-7, -radius - 12);
      ctx.lineTo(0, -radius - 26);
      ctx.lineTo(7, -radius - 12);
      ctx.lineTo(20, -radius - 22);
      ctx.lineTo(15, -radius - 2);
      ctx.closePath();
      ctx.fill();
    }

    // AURA DLA NAJWYŻSZEJ EWOLUCJI
    function drawAura(ctx, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, radius + 20, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 223, 186, 0.25)';
      ctx.shadowColor = 'rgba(255, 215, 0, 0.7)';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.restore();
    }

    // 1. POSTAĆ: LUMI
    function drawLumiPet(ctx, stage, radius) {
      if (stage === 3) drawAura(ctx, radius);

      // Skrzydełka (Faza 1, 2, 3)
      if (stage >= 1) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.ellipse(-radius + 5, -10, 16, 28, Math.PI / 4, 0, Math.PI * 2);
        ctx.ellipse(radius - 5, -10, 16, 28, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ciało
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      const gradient = ctx.createLinearGradient(-radius, -radius, radius, radius);
      if (gameState.isSleeping) {
        gradient.addColorStop(0, '#d4fc79'); gradient.addColorStop(1, '#96e6a1');
      } else if (stage === 3) {
        gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.5, '#e0c3fc'); gradient.addColorStop(1, '#8ec5fc');
      } else {
        gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.5, '#fce4ec'); gradient.addColorStop(1, '#f8bbd0');
      }
      ctx.fillStyle = gradient;
      ctx.shadowColor = 'rgba(255, 182, 193, 0.4)';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Uszka
      ctx.fillStyle = stage === 3 ? '#c7ceea' : '#f8bbd0';
      ctx.beginPath();
      ctx.arc(-radius * 0.55, -radius * 0.75, radius * 0.25, 0, Math.PI * 2);
      ctx.arc(radius * 0.55, -radius * 0.75, radius * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Korona (Faza 2, 3)
      if (stage >= 2) drawCrown(ctx, radius);

      // Rumieńce
      ctx.fillStyle = 'rgba(255, 105, 180, 0.3)';
      ctx.beginPath();
      ctx.arc(-radius * 0.5, radius * 0.15, radius * 0.16, 0, Math.PI * 2);
      ctx.arc(radius * 0.5, radius * 0.15, radius * 0.16, 0, Math.PI * 2);
      ctx.fill();

      // Oczy i Uśmiech
      drawFace(ctx, radius);
    }

    // 2. POSTAĆ: SPINACZ (PAPERCLIP)
    function drawSpinaczPet(ctx, stage, radius) {
      if (stage === 3) drawAura(ctx, radius + 10);

      let strokeColor, highlightColor;
      if (stage === 0) { // Srebrny
        strokeColor = '#a0aab5'; highlightColor = '#ffffff';
      } else if (stage === 1) { // Czarny
        strokeColor = '#1e293b'; highlightColor = '#64748b';
      } else { // Złoty / Złoty Król
        strokeColor = '#fbbf24'; highlightColor = '#fef08a';
      }

      const wireWidth = Math.max(10, radius * 0.22);
      ctx.lineWidth = wireWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const h = radius * 1.3;
      const w = radius * 0.55;

      // Główny kształt spinacza
      ctx.strokeStyle = strokeColor;
      ctx.beginPath();
      ctx.arc(0, -h + w, w, Math.PI, 0, false);
      ctx.lineTo(w, h - w);
      ctx.arc(0, h - w, w, 0, Math.PI, false);
      ctx.lineTo(-w, -h + w + 12);
      ctx.arc(-w/2, -h + w + 12, w/2, Math.PI, 0, false);
      ctx.lineTo(0, h - w - 16);
      ctx.stroke();

      // Błysk / Polerowanie metaliczne
      ctx.lineWidth = wireWidth * 0.3;
      ctx.strokeStyle = highlightColor;
      ctx.stroke();

      // Korona (Faza 2 i 3)
      if (stage >= 2) drawCrown(ctx, h - 5);

      // Oczki na spinaczu
      ctx.save();
      ctx.translate(0, -h * 0.2);
      drawFace(ctx, radius * 0.8);
      ctx.restore();
    }

    // 3. POSTAĆ: KOTEK ➔ ŻBIK ➔ TYGRYS
    function drawKotekPet(ctx, stage, radius) {
      if (stage === 3) drawAura(ctx, radius);

      let mainColor, stripeColor;
      if (stage === 0) { // Kotek
        mainColor = '#ffb703'; stripeColor = '#fb8500';
      } else if (stage === 1) { // Żbik
        mainColor = '#8d7966'; stripeColor = '#4a3e3d';
      } else { // Tygrys / Wielki Tygrys
        mainColor = '#ff6b00'; stripeColor = '#111111';
      }

      // Ciało i Głowa
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = mainColor;
      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Paski (Żbik i Tygrys)
      if (stage >= 1) {
        ctx.fillStyle = stripeColor;
        // Paski na czołu
        ctx.beginPath();
        ctx.moveTo(-8, -radius + 10); ctx.lineTo(0, -radius + 28); ctx.lineTo(8, -radius + 10); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-16, -radius + 22); ctx.lineTo(-4, -radius + 35); ctx.lineTo(-12, -radius + 35); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(16, -radius + 22); ctx.lineTo(4, -radius + 35); ctx.lineTo(12, -radius + 35); ctx.fill();

        // Paski na policzkach
        ctx.beginPath();
        ctx.moveTo(-radius + 5, -5); ctx.lineTo(-radius + 22, 0); ctx.lineTo(-radius + 8, 12); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(radius - 5, -5); ctx.lineTo(radius - 22, 0); ctx.lineTo(radius - 8, 12); ctx.fill();
      }

      // Uszy
      ctx.fillStyle = mainColor;
      // Lewe ucho
      ctx.beginPath();
      ctx.moveTo(-radius * 0.8, -radius * 0.3);
      ctx.lineTo(-radius * 0.5, -radius * 1.1);
      ctx.lineTo(-radius * 0.1, -radius * 0.8);
      ctx.closePath();
      ctx.fill();

      // Prawe ucho
      ctx.beginPath();
      ctx.moveTo(radius * 0.8, -radius * 0.3);
      ctx.lineTo(radius * 0.5, -radius * 1.1);
      ctx.lineTo(radius * 0.1, -radius * 0.8);
      ctx.closePath();
      ctx.fill();

      // Wnętrze uszu (Różowe)
      ctx.fillStyle = '#ffb5a7';
      ctx.beginPath();
      ctx.moveTo(-radius * 0.7, -radius * 0.4);
      ctx.lineTo(-radius * 0.5, -radius * 0.95);
      ctx.lineTo(-radius * 0.2, -radius * 0.75);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(radius * 0.7, -radius * 0.4);
      ctx.lineTo(radius * 0.5, -radius * 0.95);
      ctx.lineTo(radius * 0.2, -radius * 0.75);
      ctx.closePath();
      ctx.fill();

      // Pędzelki na uszach (Żbik - Faza 1)
      if (stage === 1) {
        ctx.strokeStyle = '#3a2e2b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-radius * 0.5, -radius * 1.1); ctx.lineTo(-radius * 0.55, -radius * 1.35);
        ctx.moveTo(radius * 0.5, -radius * 1.1); ctx.lineTo(radius * 0.55, -radius * 1.35);
        ctx.stroke();
      }

      // Kufa / Pyszczek (Biały)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-radius * 0.18, radius * 0.2, radius * 0.2, 0, Math.PI * 2);
      ctx.arc(radius * 0.18, radius * 0.2, radius * 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Nosek
      ctx.fillStyle = '#ff70a6';
      ctx.beginPath();
      ctx.arc(0, radius * 0.12, radius * 0.08, 0, Math.PI * 2);
      ctx.fill();

      // Wąsy
      ctx.strokeStyle = 'rgba(74, 78, 105, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-radius * 0.25, radius * 0.2); ctx.lineTo(-radius * 0.85, radius * 0.1);
      ctx.moveTo(-radius * 0.25, radius * 0.25); ctx.lineTo(-radius * 0.8, radius * 0.3);
      ctx.moveTo(radius * 0.25, radius * 0.2); ctx.lineTo(radius * 0.85, radius * 0.1);
      ctx.moveTo(radius * 0.25, radius * 0.25); ctx.lineTo(radius * 0.8, radius * 0.3);
      ctx.stroke();

      // Korona dla Wielkiego Tygrysa (Faza 3)
      if (stage === 3) drawCrown(ctx, radius);

      // Oczy i Uśmiech
      drawFace(ctx, radius);
    }

    // WSPÓLNA TWARZ (OCZY + UŚMIECH)
    function drawFace(ctx, radius) {
      ctx.fillStyle = '#4a4e69';
      if (gameState.isSleeping) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#4a4e69';
        ctx.beginPath();
        ctx.arc(-radius * 0.3, 0, radius * 0.11, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(radius * 0.3, 0, radius * 0.11, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(-radius * 0.3, -2, radius * 0.11, 0, Math.PI * 2);
        ctx.arc(radius * 0.3, -2, radius * 0.11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-radius * 0.33, -5, radius * 0.04, 0, Math.PI * 2);
        ctx.arc(radius * 0.27, -5, radius * 0.04, 0, Math.PI * 2);
        ctx.fill();

        // Uśmiech
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#4a4e69';
        if (gameState.happiness > 50) {
          ctx.arc(0, radius * 0.16, radius * 0.1, 0.1 * Math.PI, 0.9 * Math.PI);
        } else {
          ctx.arc(0, radius * 0.24, radius * 0.09, 1.1 * Math.PI, 1.9 * Math.PI);
        }
        ctx.stroke();
      }
    }

    /* MAIN RYSOWANIE PET */
    function drawPet(w, h) {
      const centerX = w / 2;
      const centerY = h / 2 + 10;
      const evo = getEvolutionStage(gameState.careTimeSeconds);
      const charKey = gameState.character || 'lumi';
      const charInfo = CHARACTERS[charKey] || CHARACTERS.lumi;
      const radius = charInfo.stages[evo.stage].radius;

      // Cień pod stworkiem
      ctx.beginPath();
      ctx.ellipse(centerX, centerY + radius + 10, (radius - 5) * (2 - petScaleY * 0.8), 12, 0, 0, Math.PI * 2);
      ctx.fillStyle = gameState.isSleeping ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.12)';
      ctx.fill();

      // Animacja falowania
      breathProgress += 0.03;
      const floatOffsetY = Math.sin(breathProgress) * 6;
      const currentScaleY = petScaleY + Math.sin(breathProgress * 1.5) * 0.02;

      ctx.save();
      ctx.translate(centerX, centerY + floatOffsetY);
      ctx.scale(1, currentScaleY);

      // Wybór rysowania w zależności od postaci
      if (charKey === 'spinacz') {
        drawSpinaczPet(ctx, evo.stage, radius);
      } else if (charKey === 'kotek') {
        drawKotekPet(ctx, evo.stage, radius);
      } else {
        drawLumiPet(ctx, evo.stage, radius);
      }

      ctx.restore();

      // Rysowanie cząsteczek
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `${p.size}px sans-serif`;
        ctx.fillText(p.symbol, p.x, p.y);
        ctx.restore();

        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function gameLoop() {
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);

      drawEnvironment(w, h);
      drawPet(w, h);

      requestAnimationFrame(gameLoop);
    }

    /* --- LOGIKA GRY & INTERFEJS --- */
    function toggleWeather() {
      const weathers = ['clear', 'rain', 'cloudy'];
      const icons = { 'clear': '☀️', 'rain': '🌧️', 'cloudy': '☁️' };
      let nextIdx = (weathers.indexOf(weatherState) + 1) % weathers.length;
      weatherState = weathers[nextIdx];
      document.getElementById('weather-toggle-btn').textContent = icons[weatherState];
    }

    function updateUI() {
      document.getElementById('val-hunger').textContent = `${Math.round(gameState.hunger)}%`;
      document.getElementById('bar-hunger').style.width = `${gameState.hunger}%`;

      document.getElementById('val-energy').textContent = `${Math.round(gameState.energy)}%`;
      document.getElementById('bar-energy').style.width = `${gameState.energy}%`;

      document.getElementById('val-happiness').textContent = `${Math.round(gameState.happiness)}%`;
      document.getElementById('bar-happiness').style.width = `${gameState.happiness}%`;

      document.getElementById('val-clean').textContent = `${Math.round(gameState.cleanliness)}%`;
      document.getElementById('bar-clean').style.width = `${gameState.cleanliness}%`;

      document.getElementById('label-sleep').textContent = gameState.isSleeping ? 'Wstań' : 'Sen';

      checkEvolution();
    }

    // Licznik opieki (co 1 sekunda)
    setInterval(() => {
      gameState.careTimeSeconds += 1;
      checkEvolution();
    }, 1000);

    // Spadek statystyk (co 3 sekundy)
    setInterval(() => {
      if (gameState.isSleeping) {
        gameState.energy = Math.min(100, gameState.energy + 1.2);
        gameState.hunger = Math.max(0, gameState.hunger - 0.15);
      } else {
        gameState.hunger = Math.max(0, gameState.hunger - 0.3);
        gameState.energy = Math.max(0, gameState.energy - 0.2);
        gameState.happiness = Math.max(0, gameState.happiness - 0.25);
        gameState.cleanliness = Math.max(0, gameState.cleanliness - 0.1);
      }
      updateUI();
      saveGame();
    }, 3000);

    setInterval(checkTimeOfDay, 60000);

    /* --- INTERAKCJE --- */
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState.isSleeping) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      gameState.happiness = Math.min(100, gameState.happiness + 5);
      
      petScaleY = 0.85;
      setTimeout(() => petScaleY = 1.1, 100);
      setTimeout(() => petScaleY = 1, 250);

      spawnParticles(clickX, clickY, '💖');
      if (navigator.vibrate) navigator.vibrate(20);
      updateUI();
    });

    document.getElementById('btn-feed').addEventListener('click', () => {
      if (gameState.isSleeping) return;
      gameState.hunger = Math.min(100, gameState.hunger + 25);
      spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '🍎');
      updateUI();
    });

    document.getElementById('btn-sleep').addEventListener('click', () => {
      gameState.isSleeping = !gameState.isSleeping;
      if (gameState.isSleeping) {
        spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '✨');
      }
      updateUI();
    });

    document.getElementById('btn-clean').addEventListener('click', () => {
      if (gameState.isSleeping) return;
      gameState.cleanliness = 100;
      spawnParticles(canvas.offsetWidth / 2, canvas.offsetHeight / 2, '🫧');
      updateUI();
    });

    document.getElementById('weather-toggle-btn').addEventListener('click', toggleWeather);
    document.getElementById('char-select-btn').addEventListener('click', openCharModal);

    // Start
    loadGame();
    checkTimeOfDay();
    resizeCanvas();
    updateUI();
    gameLoop();
  </script>
</body>
