<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <!-- Blokada przybliżania i dostosowanie do ekranów mobilnych -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps™ GOLF - Mobilny Prototyp</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            margin: 0;
            color: #333;
            touch-action: manipulation; /* Optymalizacja dotyku */
        }
        #game-container {
            background-color: #f4f6f5;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column; /* Układ pionowy dla mobile */
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            max-width: 450px; /* Limit szerokości dla tabletów/PC */
            box-sizing: border-box;
        }
        .canvas-wrapper {
            width: 100%;
            position: relative;
            padding-bottom: 150%; /* Proporcje siatki 18x27 (2/3) */
            height: 0;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #aaa;
            background-color: transparent;
        }
        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .panel {
            background: #fff;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .panel h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        button {
            font-family: 'Courier New', Courier, monospace;
            background: #eee;
            border: 1px solid #999;
            padding: 12px 8px; /* Większe obszary dotykowe (mobilne) */
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        button:active { background: #ddd; transform: scale(0.98); }
        button:disabled { background: #e0e0e0; cursor: not-allowed; color: #999; border-color: #ccc; }
        #d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        #d-pad button { height: 50px; margin: 0; font-size: 16px; }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 14px;
        }
        .info { font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="canvas-wrapper">
        <!-- Zdefiniowana logiczna rozdzielczość 360x540 (18x27 siatka co 20px) -->
        <canvas id="golfCanvas" width="360" height="540"></canvas>
    </div>
    
    <div id="controls">
        <div class="panel">
            <div class="info-grid">
                <div class="info" id="holeDisplay">Dołek: 1</div>
                <div class="info" id="totalStrokesDisplay">Suma: 0</div>
                <div class="info" id="strokesDisplay">Uderzenia: 0</div>
                <div class="info" id="terrainDisplay">Teren: Rough</div>
            </div>
        </div>

        <div class="panel">
            <h3>1. Wybierz ruch</h3>
            <button id="btnRoll" onclick="rollDice()">Dice GOLF (Rzuć k6)</button>
            <div style="text-align: center; margin: 5px 0; font-weight: bold; color: #444;" id="diceResult">-</div>
            <div style="display: flex; gap: 5px;">
                <button id="btnDriver" onclick="setSpeedGolf(6)">D(6)</button>
                <button id="btnIron" onclick="setSpeedGolf(3)">I(3)</button>
                <button id="btnPutter" onclick="setSpeedGolf(1)">P(1)</button>
            </div>
        </div>

        <div class="panel">
            <h3>2. Kierunek uderzenia</h3>
            <div id="d-pad">
                <button onclick="move(-1, -1)" id="dir-nw">NW</button>
                <button onclick="move(0, -1)" id="dir-n">N</button>
                <button onclick="move(1, -1)" id="dir-ne">NE</button>
                <button onclick="move(-1, 0)" id="dir-w">W</button>
                <button disabled style="visibility: hidden;">-</button>
                <button onclick="move(1, 0)" id="dir-e">E</button>
                <button onclick="move(-1, 1)" id="dir-sw">SW</button>
                <button onclick="move(0, 1)" id="dir-s">S</button>
                <button onclick="move(1, 1)" id="dir-se">SE</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('golfCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const cols = canvas.width / gridSize;  // 18
    const rows = canvas.height / gridSize; // 27

    let currentHoleNumber = 1;
    let totalGameStrokes = 0;
    let strokes = 0;
    
    let path = [];
    let startPos = {x: 9, y: 24};
    let holePos = {x: 9, y: 3};
    let currentPos = { ...startPos };
    let currentDistance = 0;
    let gameOver = false;

    let terrainZones = [];
    let trees = [];

    // Generator logicznych losowych liczb całkowitych z przedziału
    function rnd(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Algorytm proceduralnego generowania pola
    function generateNewHole() {
        terrainZones = [];
        trees = [];

        // Losowa pozycja startowa na dole planszy
        startPos = { x: rnd(3, 14), y: rnd(23, 25) };
        // Losowa pozycja dołka na górze planszy
        holePos = { x: rnd(3, 14), y: rnd(2, 5) };

        // 1. Generowanie 3 do 5 losowych sekcji Fairway
        let numFairways = rnd(3, 5);
        for(let i = 0; i < numFairways; i++) {
            terrainZones.push({
                type: 1,
                x: rnd(1, 12),
                y: rnd(3, 21),
                w: rnd(4, 7),
                h: rnd(4, 8)
            });
        }

        // 2. Generowanie 2 do 4 bunkrów (Sand)
        let numBunkers = rnd(2, 4);
        for(let i = 0; i < numBunkers; i++) {
            terrainZones.push({
                type: 2,
                x: rnd(2, 13),
                y: rnd(6, 18),
                w: rnd(3, 5),
                h: rnd(3, 4)
            });
        }

        // 3. Generowanie drzew jako przeszkód (od 8 do 15)
        let numTrees = rnd(8, 15);
        let failsafe = 0;
        while(trees.length < numTrees && failsafe < 50) {
            let tx = rnd(1, 16);
            let ty = rnd(2, 25);
            
            // Empiryczny warunek braku blokowania startu/dołka bezpośrednio - minimalny dystans Manhattan > 3
            let distToStart = Math.abs(tx - startPos.x) + Math.abs(ty - startPos.y);
            let distToHole = Math.abs(tx - holePos.x) + Math.abs(ty - holePos.y);
            
            if (distToStart > 3 && distToHole > 3) {
                trees.push({x: tx, y: ty});
            }
            failsafe++;
        }

        resetHoleState();
    }

    function resetHoleState() {
        strokes = 0;
        currentPos = { ...startPos };
        path = [ { ...currentPos } ];
        currentDistance = 0;
        gameOver = false;
        document.getElementById('diceResult').innerText = 'Wybierz ruch...';
        enableDirections(false);
        updateUI();
        draw();
    }

    function getTerrainAt(x, y) {
        for(let t of trees) {
            if(t.x === x && t.y === y) return 'Trees';
        }
        // Sprawdzanie stref od tyłu (mniejsze na wierzchu)
        for (let i = terrainZones.length - 1; i >= 0; i--) {
            let z = terrainZones[i];
            if (x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h) {
                if (z.type === 1) return 'Fairway';
                if (z.type === 2) return 'Sand';
            }
        }
        return 'Rough';
    }

    function rollDice() {
        if (gameOver || currentDistance > 0) return;
        let roll = rnd(1, 6);
        let terrain = getTerrainAt(currentPos.x, currentPos.y);
        
        let mod = 0;
        if (terrain === 'Fairway') mod = 1;
        if (terrain === 'Sand') mod = -1;
        
        currentDistance = Math.max(1, roll + mod);
        document.getElementById('diceResult').innerText = `Rzut: ${roll} ${mod !== 0 ? (mod>0?'+1 (F)':'-1 (S)') : ''} = Ruch o ${currentDistance}`;
        enableDirections(true);
    }

    function setSpeedGolf(dist) {
        if (gameOver || currentDistance > 0) return;
        let terrain = getTerrainAt(currentPos.x, currentPos.y);
        
        if (dist === 6 && terrain !== 'Fairway') {
            alert('Driver (6) wymaga terenu Fairway.');
            return;
        }
        if (dist === 3 && terrain === 'Sand') {
            dist = 2; // Zgodnie z zasadą - max 2 pola w piasku dla Iron
        }

        currentDistance = dist;
        document.getElementById('diceResult').innerText = `Speed GOLF: Ruch o ${dist}`;
        enableDirections(true);
    }

    function enableDirections(enable) {
        const buttons = document.querySelectorAll('#d-pad button');
        buttons.forEach(btn => btn.disabled = !enable);
    }

    // Detekcja przelotu piłki nad dołkiem (Overshooting rule)
    function isPointOnSegment(p, a, b) {
        let cross = (p.y - a.y) * (b.x - a.x) - (p.x - a.x) * (b.y - a.y);
        if (cross !== 0) return false; // Nie leży na prostej
        let dot = (p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y);
        if (dot < 0) return false; // Punkt p znajduje się przed a
        let lengthSquared = (b.x - a.x)*(b.x - a.x) + (b.y - a.y)*(b.y - a.y);
        if (dot > lengthSquared) return false; // Punkt p znajduje się za b
        return true;
    }

    function move(dx, dy) {
        if (currentDistance === 0 || gameOver) return;
        
        let targetX = currentPos.x + (dx * currentDistance);
        let targetY = currentPos.y + (dy * currentDistance);
        let targetTerrain = getTerrainAt(targetX, targetY);

        if (targetTerrain === 'Trees') {
            alert('Kolizja z drzewami! Wybierz inny kierunek.');
            return;
        }
        
        if (targetX < 0 || targetX >= cols || targetY < 0 || targetY >= rows) {
            alert('Piłka poza planszą (O.B.)!');
            return;
        }

        // Zapis ruchu
        let previousPos = { ...currentPos };
        currentPos = { x: targetX, y: targetY };
        path.push({ ...currentPos });
        strokes++;
        totalGameStrokes++;
        
        // Sprawdzanie czy po drodze przelecieliśmy przez dołek lub czy w nim wylądowaliśmy
        let inHole = isPointOnSegment(holePos, previousPos, currentPos);

        currentDistance = 0;
        document.getElementById('diceResult').innerText = 'Wybierz ruch...';
        enableDirections(false);
        updateUI();
        draw();

        if (inHole) {
            gameOver = true;
            // Nadpisz pozycję na interfejsie graficznym, by wizualnie zamknąć w dołku
            path[path.length - 1] = { ...holePos };
            draw(); 
            
            setTimeout(() => {
                alert(`Dołek wpadł! Wynik na tym dołku: ${strokes}`);
                currentHoleNumber++;
                generateNewHole();
            }, 300);
        }
    }

    function updateUI() {
        document.getElementById('holeDisplay').innerText = `Dołek: ${currentHoleNumber}`;
        document.getElementById('strokesDisplay').innerText = `Uderzenia: ${strokes}`;
        document.getElementById('totalStrokesDisplay').innerText = `Suma: ${totalGameStrokes}`;
        document.getElementById('terrainDisplay').innerText = `Teren: ${getTerrainAt(currentPos.x, currentPos.y)}`;
    }

    function draw() {
        // Skala responsywna jest obsługiwana w CSS (canvas stretch), 
        // wewnętrznie rysujemy na sztywnym wymiarze 360x540.
        ctx.fillStyle = '#f4f6f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Teren
        terrainZones.forEach(z => {
            if (z.type === 1) ctx.fillStyle = '#dbe3df'; // Fairway
            if (z.type === 2) ctx.fillStyle = '#a0a5a3'; // Sand
            
            ctx.beginPath();
            ctx.roundRect(z.x * gridSize, z.y * gridSize, z.w * gridSize, z.h * gridSize, 10);
            ctx.fill();
        });

        // Siatka punktowa (Grid)
        ctx.fillStyle = '#999';
        for (let i = 1; i < cols; i++) {
            for (let j = 1; j < rows; j++) {
                ctx.beginPath();
                ctx.arc(i * gridSize, j * gridSize, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Drzewa
        ctx.fillStyle = '#333';
        ctx.font = '16px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        trees.forEach(t => {
            ctx.fillText('🌲', t.x * gridSize, t.y * gridSize);
        });

        // Dołek z wizualizacją
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(holePos.x * gridSize, holePos.y * gridSize, 6, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(holePos.x * gridSize, holePos.y * gridSize);
        ctx.lineTo(holePos.x * gridSize, (holePos.y - 1.5) * gridSize);
        ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(holePos.x * gridSize, (holePos.y - 1.5) * gridSize);
        ctx.lineTo(holePos.x * gridSize + 8, (holePos.y - 1.2) * gridSize);
        ctx.lineTo(holePos.x * gridSize, (holePos.y - 0.9) * gridSize);
        ctx.fill();

        // Linia ścieżki (Ruchy)
        if (path.length > 1) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(path[0].x * gridSize, path[0].y * gridSize);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x * gridSize, path[i].y * gridSize);
            }
            ctx.stroke();
        }

        // Punkty uderzeń (Nodes) i obecna pozycja piłki
        path.forEach((p, index) => {
            ctx.fillStyle = index === path.length - 1 ? '#000' : '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p.x * gridSize, p.y * gridSize, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        });
    }

    // Inicjalizacja pierwszej mapy po załadowaniu
    window.onload = generateNewHole;
</script>
</body>
</html>
