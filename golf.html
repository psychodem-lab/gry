
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps™ GOLF - Kliknij i Graj</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            color: #333;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            background-color: #f4f6f5;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        canvas {
            border: 1px solid #aaa;
            background-color: transparent;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            margin-bottom: 10px;
            touch-action: none;
            cursor: pointer;
        }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .panel {
            background: #fff;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .panel h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 8px;}
        button {
            font-family: 'Courier New', Courier, monospace;
            background: #eee;
            border: 1px solid #999;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 5px;
            touch-action: manipulation;
            border-radius: 4px;
        }
        button:active { background: #ddd; transform: scale(0.98); }
        button:disabled { background: #ccc; cursor: not-allowed; color: #888; transform: none; }
        .info { font-weight: bold; margin-bottom: 3px; font-size: 14px; }
        .flex-info { display: flex; justify-content: space-between; flex-wrap: wrap; }
        #instruction {
            font-size: 13px;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="golfCanvas" width="360" height="540"></canvas>
    
    <div id="controls">
        <div class="panel">
            <h3>Status</h3>
            <div class="flex-info">
                <div class="info" id="holeDisplay">Dołek: 1</div>
                <div class="info" id="strokesDisplay">Uderzenia: 0</div>
            </div>
            <div class="info" id="terrainDisplay">Teren: Rough</div>
            <div id="instruction">Wybierz ruch poniżej</div>
        </div>

        <div class="panel">
            <h3>1. Wybierz uderzenie</h3>
            <button id="btnRoll" onclick="rollDice()">Dice GOLF (Rzuć k6)</button>
            <div style="text-align: center; margin: 3px 0; font-weight: bold; font-size: 13px;" id="diceResult">-</div>
            <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
            <div style="display: flex; gap: 5px;">
                <button id="btnDriver" onclick="setSpeedGolf(6)">Driver (6)</button>
                <button id="btnIron" onclick="setSpeedGolf(3)">Iron (3)</button>
                <button id="btnPutter" onclick="setSpeedGolf(1)">Putt (1)</button>
            </div>
        </div>

        <button onclick="resetHoleCurrent()">Resetuj ten dołek (Mulligan)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('golfCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20; 
    const cols = canvas.width / gridSize; // 18
    const rows = canvas.height / gridSize; // 27

    let currentHole = 1;
    let strokes = 0;
    let path = [];
    let startPos = {x: 0, y: 0};
    let holePos = {x: 0, y: 0};
    let currentPos = {x: 0, y: 0};
    let currentDistance = 0;
    let gameOver = false;
    
    let terrainZones = [];
    let trees = [];
    let validTargets = []; // Podświetlone zielone punkty

    const directions = [
        {dx: 0, dy: -1},  // N
        {dx: 1, dy: -1},  // NE
        {dx: 1, dy: 0},   // E
        {dx: 1, dy: 1},   // SE
        {dx: 0, dy: 1},   // S
        {dx: -1, dy: 1},  // SW
        {dx: -1, dy: 0},  // W
        {dx: -1, dy: -1}  // NW
    ];

    function generateProceduralLevel() {
        terrainZones = [];
        trees = [];

        startPos = { x: Math.floor(Math.random() * 12) + 3, y: Math.floor(Math.random() * 3) + 22 };
        holePos = { x: Math.floor(Math.random() * 12) + 3, y: Math.floor(Math.random() * 4) + 3 };

        // Fairway
        let numFairways = Math.floor(Math.random() * 3) + 2;
        for (let i = 0; i < numFairways; i++) {
            terrainZones.push({
                type: 1,
                x: Math.floor(Math.random() * 10) + 2,
                y: Math.floor(Math.random() * 18) + 4,
                w: Math.floor(Math.random() * 6) + 3,
                h: Math.floor(Math.random() * 7) + 4
            });
        }

        // Bunkry
        let numSand = Math.floor(Math.random() * 3) + 1;
        for (let i = 0; i < numSand; i++) {
            terrainZones.push({
                type: 2,
                x: Math.floor(Math.random() * 12) + 2,
                y: Math.floor(Math.random() * 18) + 4,
                w: Math.floor(Math.random() * 4) + 2,
                h: Math.floor(Math.random() * 4) + 2
            });
        }

        // Drzewa
        let numTrees = Math.floor(Math.random() * 11) + 10;
        for (let i = 0; i < numTrees; i++) {
            let tx = Math.floor(Math.random() * 14) + 2;
            let ty = Math.floor(Math.random() * 23) + 2;
            
            let safeFromStart = Math.abs(tx - startPos.x) > 1 || Math.abs(ty - startPos.y) > 1;
            let safeFromHole = Math.abs(tx - holePos.x) > 1 || Math.abs(ty - holePos.y) > 1;

            if (safeFromStart && safeFromHole) {
                trees.push({x: tx, y: ty});
            }
        }
    }

    function initGame() {
        currentHole = 1;
        generateProceduralLevel();
        resetHoleData();
    }

    function nextHole() {
        currentHole++;
        generateProceduralLevel();
        resetHoleData();
    }

    function resetHoleCurrent() {
        resetHoleData();
    }

    function resetHoleData() {
        strokes = 0;
        currentPos = { ...startPos };
        path = [ { ...currentPos } ];
        currentDistance = 0;
        validTargets = [];
        gameOver = false;
        document.getElementById('diceResult').innerText = '-';
        document.getElementById('holeDisplay').innerText = `Dołek: ${currentHole}`;
        document.getElementById('instruction').innerText = 'Wybierz ruch poniżej';
        updateUI();
        draw();
    }

    function getTerrainAt(x, y) {
        for(let t of trees) {
            if(t.x === x && t.y === y) return 'Trees';
        }
        for (let i = terrainZones.length - 1; i >= 0; i--) {
            let z = terrainZones[i];
            if (x >= z.x && x < z.x + z.w && y >= z.y && y < z.y + z.h) {
                if (z.type === 1) return 'Fairway';
                if (z.type === 2) return 'Sand';
            }
        }
        return 'Rough';
    }

    function calculateValidTargets() {
        validTargets = [];
        if (currentDistance <= 0 || gameOver) return;

        let startTerrain = getTerrainAt(currentPos.x, currentPos.y);

        directions.forEach(dir => {
            let tx = currentPos.x + dir.dx * currentDistance;
            let ty = currentPos.y + dir.dy * currentDistance;

            // Sprawdzenie krawędzi planszy
            if (tx > 0 && tx < cols - 1 && ty > 0 && ty < rows - 1) {
                let targetTerrain = getTerrainAt(tx, ty);
                
                // Drzewa: Zakaz lądowania na drzewie (chyba że ruch z Fairway pozwala na przelot, ale nie lądowanie)
                if (targetTerrain !== 'Trees') {
                    validTargets.push({ x: tx, y: ty });
                }
            }
        });

        if (validTargets.length > 0) {
            document.getElementById('instruction').innerText = 'Kliknij zieloną kropkę na planszy!';
        } else {
            document.getElementById('instruction').innerText = 'Brak możliwości ruchu! Zrób Mulligan.';
        }
    }

    function rollDice() {
        if (gameOver) return;
        let roll = Math.floor(Math.random() * 6) + 1;
        let terrain = getTerrainAt(currentPos.x, currentPos.y);
        
        let mod = 0;
        if (terrain === 'Fairway') mod = 1;
        if (terrain === 'Sand') mod = -1;
        
        currentDistance = Math.max(1, roll + mod);
        document.getElementById('diceResult').innerText = `Rzut: ${roll} ${mod !== 0 ? (mod>0?'+1':'-1') : ''} = Zasięg: ${currentDistance}`;
        
        calculateValidTargets();
        draw();
    }

    function setSpeedGolf(dist) {
        if (gameOver) return;
        let terrain = getTerrainAt(currentPos.x, currentPos.y);
        
        if (dist === 6 && terrain !== 'Fairway') {
            alert('Driver (6) tylko z pola Fairway!');
            return;
        }
        if (dist === 3 && terrain === 'Sand') {
            dist = 2;
            alert('W bunkrze Iron ma zasięg ograniczenie do 2 pól.');
        }

        currentDistance = dist;
        document.getElementById('diceResult').innerText = `Kij: ${dist} pól`;
        
        calculateValidTargets();
        draw();
    }

    // Klikanie / dotykanie planszy
    function handleCanvasClick(e) {
        if (validTargets.length === 0 || gameOver) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const clickX = (e.clientX - rect.left) * scaleX;
        const clickY = (e.clientY - rect.top) * scaleY;

        // Znalezienie najbliższego celu
        let selectedTarget = null;
        validTargets.forEach(target => {
            let targetCanvasX = target.x * gridSize;
            let targetCanvasY = target.y * gridSize;
            let dist = Math.hypot(clickX - targetCanvasX, clickY - targetCanvasY);
            
            // Margines kliknięcia (promień 15px)
            if (dist < 15) {
                selectedTarget = target;
            }
        });

        if (selectedTarget) {
            makeMove(selectedTarget);
        }
    }

    function makeMove(target) {
        currentPos = { x: target.x, y: target.y };
        path.push({ ...currentPos });
        strokes++;
        currentDistance = 0;
        validTargets = [];
        
        document.getElementById('diceResult').innerText = '-';
        document.getElementById('instruction').innerText = 'Wybierz następny ruch';
        
        updateUI();
        draw();
        checkWinCondition();
    }

    function checkWinCondition() {
        if (currentPos.x === holePos.x && currentPos.y === holePos.y) {
            gameOver = true;
            document.getElementById('instruction').innerText = 'DOŁEK ZALICZONY!';
            setTimeout(() => {
                alert(`Gratulacje! Wbiłeś piłkę do dołka w ${strokes} uderzeniach. Ładowanie kolejnego dołka...`);
                nextHole();
            }, 50);
        }
    }

    function updateUI() {
        document.getElementById('strokesDisplay').innerText = `Uderzenia: ${strokes}`;
        document.getElementById('terrainDisplay').innerText = `Teren: ${getTerrainAt(currentPos.x, currentPos.y)}`;
    }

    function draw() {
        ctx.fillStyle = '#f4f6f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Strefy
        terrainZones.forEach(z => {
            if (z.type === 1) ctx.fillStyle = '#dbe3df'; // Fairway
            if (z.type === 2) ctx.fillStyle = '#a0a5a3'; // Sand
            ctx.beginPath();
            ctx.roundRect(z.x * gridSize - gridSize/2, z.y * gridSize - gridSize/2, z.w * gridSize, z.h * gridSize, 10);
            ctx.fill();
        });

        // Siatka punktowa
        ctx.fillStyle = '#aaa';
        for (let i = 1; i < cols; i++) {
            for (let j = 1; j < rows; j++) {
                ctx.beginPath();
                ctx.arc(i * gridSize, j * gridSize, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Drzewa
        ctx.fillStyle = '#333';
        ctx.font = '16px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        trees.forEach(t => {
            ctx.fillText('🌲', t.x * gridSize, t.y * gridSize);
        });

        // Dołek
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(holePos.x * gridSize, holePos.y * gridSize, 6, 0, Math.PI * 2);
        ctx.stroke();
        
        // Flaga
        ctx.beginPath();
        ctx.moveTo(holePos.x * gridSize, holePos.y * gridSize);
        ctx.lineTo(holePos.x * gridSize, (holePos.y - 1.5) * gridSize);
        ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(holePos.x * gridSize, (holePos.y - 1.5) * gridSize);
        ctx.lineTo(holePos.x * gridSize + 8, (holePos.y - 1.2) * gridSize);
        ctx.lineTo(holePos.x * gridSize, (holePos.y - 0.9) * gridSize);
        ctx.fill();

        // Ścieżka uderzeń
        if (path.length > 1) {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(path[0].x * gridSize, path[0].y * gridSize);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x * gridSize, path[i].y * gridSize);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Podświetlanie dostępnych ruchów (Zielone kropki)
        validTargets.forEach(target => {
            ctx.fillStyle = '#2e7d32';
            ctx.strokeStyle = '#a5d6a7';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(target.x * gridSize, target.y * gridSize, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        });

        // Rysowanie piłki i poprzednich ruchów
        path.forEach((p, index) => {
            ctx.fillStyle = index === path.length - 1 ? '#000' : '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(p.x * gridSize, p.y * gridSize, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        });
    }

    // Nasłuchiwanie dotyku i kliknięć
    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length > 0) {
            handleCanvasClick(e.touches[0]);
        }
    }, { passive: false });

    initGame();
</script>
</body>
</html>
